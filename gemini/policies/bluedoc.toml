# bluedoc plan gate, Gemini CLI. Plan mode denies shell commands (the default plan.toml catch-all, priority 40), but
# the gate asks the agent to wait for the reader (serve.py wait / reply) and to revise the plan doc (build.py patch)
# while it stays in plan mode. These rules ask you instead of denying, for exactly those commands of this extension.
# Extension rules can't allow a tool outright (Gemini ignores `allow` from extensions), so the most they can do is ask:
# https://github.com/google-gemini/gemini-cli/blob/main/docs/extensions/reference.md#policy-engine

[[rule]]
toolName = "run_shell_command"
commandRegex = 'python3 [^"]*/skills/bluedoc/scripts/(?:serve\.py (?:wait|reply)|build\.py patch) '
decision = "ask_user"
priority = 100
modes = ["plan"]
interactive = true
