/* plan blocks. steps: HorizonUI Timeline + ProgressSteps; files: ChangeTable rows by folder; media; compare */

  background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line-strong); }

.s-done .bp-step-dot { color: #fff; background: var(--ok); box-shadow: none; }

.bp-step-head { grid-column: 2; min-width: 0; display: flex; align-items: flex-start; gap: 10px; padding: 10px 4px 10px 0; border: 0; background: none; text-align: left; color: inherit; font: inherit; border-radius: 8px; }

.bp-step-fc { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--fg-subtle); }
.bp-step-fc .bd-ic { width: 13px; height: 13px; }
.bp-eff { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px 0 6px; border-radius: 6px; font: 650 11px/1 var(--mono); color: var(--fg-muted); background: var(--inset); box-shadow: inset 0 0 0 1px var(--line); }

.bp-step .bp-cl-chev { margin-top: 5px; }

.bp-step-body { grid-column: 2; padding: 0 12px 14px 0; font-size: 14px; }

.bp-fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.bp-fchip { display: inline-flex; align-items: center; gap: 5px; height: 24px; max-width: 100%; padding: 0 8px; border: 0; border-radius: 7px; font: 500 12px var(--mono); color: var(--fg-muted);
  background: var(--inset); box-shadow: inset 0 0 0 1px var(--line); transition: color .12s, box-shadow .12s; }

.bp-files-sum { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; }

.bp-fsum b, .bp-fbadge { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; font: 700 10.5px/1 var(--mono); color: var(--accent-fg); background: var(--accent-tint); }
.k-add :is(b, .bp-fbadge) { color: var(--ok-fg); background: var(--ok-tint); }
.k-del :is(b, .bp-fbadge) { color: var(--risk-fg); background: var(--risk-tint); }

.bp-fdir { display: flex; align-items: center; gap: 7px; padding: 9px 16px 3px; font: 500 12px/1.5 var(--mono); color: var(--fg-subtle); overflow-wrap: anywhere; }

.bp-fgrp ul { list-style: none; margin: 0; padding: 0; }
.bp-frow { display: grid; grid-template-columns: 20px 16px minmax(0, 1fr) auto; align-items: start; column-gap: 10px; padding: 7px 12px 7px 16px; scroll-margin-top: calc(var(--top-h) + 16px); transition: background .1s; }
.bp-frow:hover { background: var(--hover); }

.bp-fmain { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.bp-fname { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; font: 550 13px/1.65 var(--mono); color: var(--fg); overflow-wrap: anywhere; }
.bp-frow.k-del .nm { color: var(--fg-muted); text-decoration: line-through; text-decoration-color: color-mix(in oklch, var(--risk) 60%, transparent); }
.bp-fname .from { font: 400 12px var(--sans); color: var(--fg-subtle); }
.bp-fname .from code { font-size: 11.5px; background: none; padding: 0; color: var(--fg-muted); }
.bp-fwhy { font-size: 13.5px; line-height: 1.5; color: var(--fg-muted); }
.bp-fstep { margin-top: 0; font-family: var(--mono); font-size: 11.5px; }
.bp-fstep:disabled { opacity: .55; cursor: default; }
.bp-frow.bd-chg { box-shadow: inset 3px 0 0 var(--chg); } .bp-frow.bd-chg-add { background: color-mix(in oklch, var(--ok-tint) 70%, transparent); }
.bp-frow.bd-ghost .nm { text-decoration: line-through; color: var(--risk-fg); }
.bp-step.bd-chg { box-shadow: inset 3px 0 0 var(--chg); }

.bp-media { margin: 0 auto; }
.bp-media-fr { position: relative; border-radius: 14px; overflow: hidden; background: var(--inset); box-shadow: var(--shadow-1); }

.bp-media-fr:hover .bp-media-zoom, .bp-media-zoom:focus-visible { opacity: 1; }
@media (hover: none) { .bp-media-zoom { opacity: 1; } }
.bp-media > .bp-caption { text-align: center; margin-top: 10px; text-wrap: balance; }
.bp-media-miss { display: flex; align-items: center; gap: 10px; padding: 20px 18px; font-size: 13.5px; color: var(--fg-subtle); overflow-wrap: anywhere; }

.bd-lb { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; overflow: hidden; cursor: zoom-out; }
.bd-lb[open] { display: grid; place-items: center; }
.bd-lb::backdrop { background: oklch(14% 0.01 264 / .84); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }

.bd-lb figcaption { max-width: 60em; color: oklch(94% 0 0); font-size: 13.5px; text-align: center; text-wrap: balance; }

.bd-lb .x { position: fixed; top: 14px; right: 14px; }
.bp-cmpr-t { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; color: var(--fg-subtle); }
.bp-cmpr-t h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.005em; line-height: 1.4; color: var(--fg); }
.bp-cmpr-g { display: grid; grid-template-columns: minmax(0, 1fr) 0 minmax(0, 1fr); column-gap: 14px; align-items: stretch; }
.bp-cmpr-ar { position: relative; z-index: 1; display: grid; place-items: center; }
.bp-cmpr-ar b { position: absolute; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: var(--fg-muted);
  background: linear-gradient(180deg, var(--key-top), var(--key-bot)); box-shadow: var(--shadow-key), 0 0 0 4px var(--canvas); }

.bp-cmpr-h { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 6px 0 14px; border-bottom: 1px solid var(--line-soft); font: 600 11px/1.4 var(--sans); letter-spacing: .07em;
  text-transform: uppercase; color: var(--fg-muted); }
.bp-cmpr-h .d { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--todo); box-shadow: 0 0 0 3px var(--todo-tint); }
.bp-cmpr-side.after .bp-cmpr-h .d { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-tint); }
.bp-cmpr-h .l { flex: 1; min-width: 0; }
.bp-cmpr-h .l code { text-transform: none; letter-spacing: 0; }
.bp-cmpr-h .lg { font: 500 11px var(--mono); letter-spacing: 0; text-transform: none; color: var(--fg-subtle); }
.bp-cmpr-h .bp-btn { height: 26px; padding: 0 6px; }
.bp-cmpr-b { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; font-size: 14px; }
.bp-cmpr-md > :first-child { margin-top: 0; } .bp-cmpr-md > :last-child { margin-bottom: 0; }
.bp-cmpr-md p { margin: 6px 0; } .bp-cmpr-md ul, .bp-cmpr-md ol { margin: 6px 0; padding-left: 20px; }
.bp-cmpr-img { display: block; max-width: 100%; height: auto; margin: 0 auto; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); }
img.bp-cmpr-img { cursor: zoom-in; }
.bp-cmpr-code { flex: 1; margin: 0; padding: 12px 14px; overflow-x: auto; color: var(--fg); font: 12.5px/1.65 var(--mono); background: var(--panel); }

@media (max-width: 900px) {
  .bp-cmpr-g { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 0 auto; row-gap: 14px; }
  .bp-cmpr-ar b { transform: rotate(90deg); }
  .bp-step { padding: 0 4px 0 12px; column-gap: 12px; }
  .bp-frow { padding-left: 12px; padding-right: 10px; column-gap: 8px; }
  .bp-fdir { padding-left: 12px; }
}
@media (max-width: 600px) {
  .bp-frow { grid-template-columns: 20px minmax(0, 1fr) auto; }
  .bp-frow > .bp-fic { display: none; }
}

/* toast: HorizonUI Toaster */
.bp-toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 8px); display: flex; align-items: center; gap: 8px;
  background: light-dark(oklch(22% 0.006 264), oklch(30% 0.005 264)); color: oklch(97% 0 0); padding: 9px 14px; border-radius: 10px; font-size: 13.5px; font-weight: 500;
  box-shadow: var(--shadow-3); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease), transform .2s var(--ease); z-index: 60; }
.bp-toast::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.bp-toast.on { opacity: 1; transform: translate(-50%, 0); }

/* change requests: bottom toolbar (HorizonUI Tray of Keys with Grooves, Kbd tooltips), marks, hover outline,
   comments sidebar, dialog. Tray, key, groove and fill values are HorizonUI's, light and dark. */
:root {
  --hk-top: oklch(100% 0 0); --hk-bot: oklch(97.2% 0.002 264); --hk-ring: oklch(23% 0.01 264 / 0.09); --hk-down: oklch(93.4% 0.003 264);
  --tray-top: oklch(99.2% 0.001 264); --tray-bot: oklch(96.6% 0.002 264);
  --shadow-hk: 0 0 0 1px var(--hk-ring), 0 1px 1px oklch(23% 0.01 264 / 0.06), 0 2px 5px oklch(23% 0.01 264 / 0.07), inset 0 1px 0 oklch(100% 0 0), inset 0 -1px 0 oklch(23% 0.01 264 / 0.05);
  --shadow-hk-down: inset 0 1px 3px oklch(23% 0.01 264 / 0.16), inset 0 0 0 1px oklch(23% 0.01 264 / 0.08);
  --shadow-tray: 0 0 0 1px oklch(23% 0.01 264 / 0.06), 0 10px 30px oklch(23% 0.01 264 / 0.08), inset 0 1px 0 oklch(100% 0 0);
  --shadow-well: inset 0 1px 3px oklch(23% 0.01 264 / 0.12), inset 0 0 0 1px oklch(23% 0.01 264 / 0.05);
  --shadow-fill: 0 0 0 1px oklch(0% 0 0 / 0.5), inset 0 1px 0 oklch(100% 0 0 / 0.18), 0 2px 5px oklch(0% 0 0 / 0.18);
  --groove: linear-gradient(90deg, oklch(23% 0.01 264 / 0.1) 50%, oklch(100% 0 0 / 0.9) 50%);
  --accent-solid: oklch(51% 0.19 254);
  --ok-solid: oklch(53% 0.14 152);
  --tip: oklch(22% 0.006 264);
  --sp-w: 344px; --sp-sheet-h: min(52vh, 460px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --hk-top: oklch(29% 0.004 264); --hk-bot: oklch(24.5% 0.004 264); --hk-ring: oklch(0% 0 0 / 0.55); --hk-down: oklch(16.5% 0.003 264);
  --tray-top: oklch(24% 0.004 264); --tray-bot: oklch(21% 0.0035 264);
  --shadow-hk: 0 0 0 1px var(--hk-ring), 0 1px 1px oklch(0% 0 0 / 0.35), 0 3px 6px oklch(0% 0 0 / 0.35), inset 0 1px 0 oklch(100% 0 0 / 0.09), inset 0 -1px 0 oklch(0% 0 0 / 0.25);
  --shadow-hk-down: inset 0 1px 4px oklch(0% 0 0 / 0.6), inset 0 0 0 1px oklch(0% 0 0 / 0.5);
  --shadow-tray: 0 0 0 1px oklch(0% 0 0 / 0.7), 0 16px 40px oklch(0% 0 0 / 0.45), inset 0 1px 0 oklch(100% 0 0 / 0.07);
  --shadow-well: inset 0 1px 4px oklch(0% 0 0 / 0.6), inset 0 0 0 1px oklch(0% 0 0 / 0.45), 0 1px 0 oklch(100% 0 0 / 0.05);
  --shadow-fill: 0 0 0 1px oklch(0% 0 0 / 0.5), inset 0 1px 0 oklch(100% 0 0 / 0.18), 0 2px 5px oklch(0% 0 0 / 0.4);
  --groove: linear-gradient(90deg, oklch(0% 0 0 / 0.6) 50%, oklch(100% 0 0 / 0.07) 50%);
  --tip: oklch(30% 0.005 264);
} }
:root[data-theme="dark"] {
  --hk-top: oklch(29% 0.004 264); --hk-bot: oklch(24.5% 0.004 264); --hk-ring: oklch(0% 0 0 / 0.55); --hk-down: oklch(16.5% 0.003 264);
  --tray-top: oklch(24% 0.004 264); --tray-bot: oklch(21% 0.0035 264);
  --shadow-hk: 0 0 0 1px var(--hk-ring), 0 1px 1px oklch(0% 0 0 / 0.35), 0 3px 6px oklch(0% 0 0 / 0.35), inset 0 1px 0 oklch(100% 0 0 / 0.09), inset 0 -1px 0 oklch(0% 0 0 / 0.25);
  --shadow-hk-down: inset 0 1px 4px oklch(0% 0 0 / 0.6), inset 0 0 0 1px oklch(0% 0 0 / 0.5);
  --shadow-tray: 0 0 0 1px oklch(0% 0 0 / 0.7), 0 16px 40px oklch(0% 0 0 / 0.45), inset 0 1px 0 oklch(100% 0 0 / 0.07);
  --shadow-well: inset 0 1px 4px oklch(0% 0 0 / 0.6), inset 0 0 0 1px oklch(0% 0 0 / 0.45), 0 1px 0 oklch(100% 0 0 / 0.05);
  --shadow-fill: 0 0 0 1px oklch(0% 0 0 / 0.5), inset 0 1px 0 oklch(100% 0 0 / 0.18), 0 2px 5px oklch(0% 0 0 / 0.4);
  --groove: linear-gradient(90deg, oklch(0% 0 0 / 0.6) 50%, oklch(100% 0 0 / 0.07) 50%);
  --tip: oklch(30% 0.005 264);
}
.bd-home { display: inline-flex; align-items: center; gap: 6px; flex: none; height: 28px; padding: 0 8px; margin-left: -4px; border-radius: 8px; font-size: 13px; font-weight: 500;
  color: var(--fg-muted); text-decoration: none; }
.bd-home:hover { background: var(--hover); color: var(--fg); }
.bd-home .bd-ic { width: 15px; height: 15px; }
@media (max-width: 900px) { .bd-home .l { display: none; } }
/* the tray floats centred over the page, or over the part the docked sidebar leaves */
.bd-anntb { position: fixed; left: 50%; bottom: 16px; z-index: 50; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 7px; border-radius: 20px;
  background: linear-gradient(180deg, var(--tray-top), var(--tray-bot)); box-shadow: var(--shadow-tray), 0 2px 6px oklch(23% 0.01 264 / 0.06); transition: left .22s var(--ease), bottom .22s var(--ease); }
.bd-key { position: relative; display: inline-grid; place-items: center; flex: none; width: 38px; height: 38px; padding: 0; border: 0; border-radius: 12px; color: var(--fg-muted);
  background: linear-gradient(180deg, var(--hk-top), var(--hk-bot)); box-shadow: var(--shadow-hk); transition: transform 90ms var(--ease), box-shadow .12s var(--ease), color .12s; }
.bd-key:hover { color: var(--fg); background: linear-gradient(var(--hover), var(--hover)), linear-gradient(180deg, var(--hk-top), var(--hk-bot)); }
.bd-key:active:not(:disabled), .bd-key[aria-pressed="true"] { transform: translateY(1px); color: var(--fg); background: var(--hk-down); box-shadow: var(--shadow-hk-down); }
.bd-key:focus-visible { box-shadow: var(--shadow-hk), var(--focus-ring); }
.bd-key[aria-pressed="true"]:focus-visible { box-shadow: var(--shadow-hk-down), var(--focus-ring); }
.bd-key .bd-ic { width: 18px; height: 18px; }
.bd-key > .b { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; display: grid; place-items: center;
  font: 650 10.5px/1 var(--sans); font-variant-numeric: tabular-nums; color: #fff; background: var(--accent-solid); box-shadow: 0 0 0 2px var(--tray-top); pointer-events: none; }
.bd-key > .b[hidden] { display: none; }
.bd-key.go { display: inline-flex; align-items: center; width: auto; gap: 8px; padding: 0 8px 0 13px; font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap;
  background: var(--accent-solid) linear-gradient(180deg, color-mix(in oklch, var(--accent-solid), white 8%), var(--accent-solid)); box-shadow: var(--shadow-fill); }
.bd-key.go:hover { color: #fff; filter: brightness(.95); background: var(--accent-solid) linear-gradient(180deg, color-mix(in oklch, var(--accent-solid), white 8%), var(--accent-solid)); }
.bd-key.go:active:not(:disabled) { transform: translateY(1px) scale(.98); filter: brightness(.9); box-shadow: var(--shadow-fill); background: var(--accent-solid); }
.bd-key.go .bd-ic { width: 16px; height: 16px; }
.bd-key.go .n { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 8px; display: grid; place-items: center; font: 650 12px/1 var(--sans); font-variant-numeric: tabular-nums;
  background: oklch(100% 0 0 / .2); box-shadow: inset 0 1px 0 oklch(100% 0 0 / .12); }
.bd-key.go:disabled { cursor: default; filter: none; color: var(--fg-subtle); background: linear-gradient(180deg, var(--hk-top), var(--hk-bot)); box-shadow: var(--shadow-hk); }
.bd-key.go:disabled .n { background: var(--inset); box-shadow: var(--shadow-well); }
.bd-groove { flex: none; width: 2px; height: 24px; margin: 0 2px; border-radius: 1px; background: var(--groove); }
.bd-anntb .sw { display: inline-flex; align-items: center; gap: 5px; height: 38px; padding: 0 9px; border-radius: 12px; background: var(--hk-down); box-shadow: var(--shadow-well); }
.bd-anntb .sw[hidden] { display: none; }
.bd-anntb .sw button { width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%; background: var(--pen); box-shadow: inset 0 0 0 1px oklch(0% 0 0 / .15); }
.bd-anntb .sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--hk-down), 0 0 0 3.5px var(--pen); }
@media (max-width: 600px) {
  .bd-anntb { bottom: 10px; gap: 4px; padding: 5px; border-radius: 17px; }
  .bd-key { width: 34px; height: 34px; border-radius: 11px; }
  .bd-key.go { padding: 0 6px 0 9px; gap: 6px; } .bd-key.go .l { display: none; }
  .bd-anntb .sw { height: 34px; padding: 0 7px; gap: 4px; } .bd-anntb .sw button { width: 16px; height: 16px; }
  .bd-anntb[data-m="draw"] .eye { display: none; }
}
/* HorizonUI Tooltip with Kbd chips */
.bd-tip { position: fixed; left: 0; top: 0; z-index: 61; display: inline-flex; align-items: center; gap: 8px; max-width: min(300px, calc(100vw - 16px)); padding: 6px 8px 6px 10px; border-radius: 9px;
  background: var(--tip); color: oklch(97% 0 0); font: 500 12.5px/1.35 var(--sans); box-shadow: var(--shadow-3); pointer-events: none; animation: bd-tip-in .12s var(--ease); }
.bd-tip[hidden] { display: none; }
.bd-tip .k { display: inline-flex; gap: 3px; flex: none; }
@keyframes bd-tip-in { from { opacity: 0; transform: translateY(3px); } }
.bd-kbd { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 5px; font: 500 10.5px/1 var(--mono); color: var(--fg-muted);
  background: linear-gradient(180deg, var(--hk-top), var(--hk-bot)); box-shadow: var(--shadow-hk); }
.bd-tip .bd-kbd { color: oklch(97% 0 0 / .78); background: oklch(100% 0 0 / .1); box-shadow: inset 0 0 0 1px oklch(100% 0 0 / .12), inset 0 -1px 0 oklch(0% 0 0 / .3); }
html.bd-tray-on .bd-shell { padding-bottom: 150px; }
html.bd-tray-on .bp-toast { bottom: 84px; }
@media (max-width: 600px) { html.bd-tray-on .bp-toast { bottom: 70px; } }
/* the revision tray (compare view, earlier revisions): what is shown, ↑ n of N ↓, and the way out */
.bd-revtb .lbl { display: inline-flex; align-items: center; gap: 7px; padding: 0 6px 0 8px; font-size: 13px; color: var(--fg-muted); white-space: nowrap; }
.bd-revtb .lbl b { font: 650 13px var(--mono); color: var(--fg); }
.bd-revtb .lbl .bd-ic { width: 16px; height: 16px; color: var(--fg-subtle); }
.bd-revtb .pos { min-width: 4.6em; text-align: center; font: 500 12.5px var(--mono); color: var(--fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bd-key.txt { display: inline-flex; align-items: center; width: auto; gap: 7px; padding: 0 13px 0 11px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.bd-key.txt .bd-ic { width: 16px; height: 16px; }

x","label":"Fix in PR"},{"id":"ticket","label":"Ticket"},{"id":"decline","label":"Decline"}],"recommend":"fix"},{"id":"float-cents","text":"Tiered line totals are fractional cents","sub":"Recommend fix in PR: Without a coupon the fraction reaches VAT and the payment request.","state":"major","stateKind":"warn","detail":"**Reviewer:** `gross * (1 - tier.percent / 100)` returns 3163.5 for 3 × 1110 cents at 5 %.\n\n**My reasoning:** `applyCoupon` rounds only when a coupon is present (`src/pricing/discounts.ts:14`). Without one, the subtotal stays fractional and `addTax` rounds once more, so line and order totals can disagree by a cent. Every other money path in the repo uses integer cents (`docs/pricing.md:3`).\n\n**Fix:** `Math.round(gross * (100 - tier.percent) / 100)`, the form `applyCoupon` already uses.\n\n**Verify:** `Number.isInteger(lineTotal({qty: 3, unitCents: 1110}))`.","choices":[{"id":"fix","label":"Fix in PR"},{"id":"ticket","label":"Ticket"},{"id":"decline","label":"Decline"}],"recommend":"fix"},{"id":"savings-coupon","text":"`bulkSavingsCents` also counts the coupon","sub":"Recommend fix in PR: A 15 % coupon would show on the receipt as a bulk saving.","state":"major","stateKind":"warn","detail":"**Reviewer:** savings are gross-with-tax minus the final total, so the coupon counts as a bulk saving.\n\n**My reasoning:** `src/orders/createOrder.ts:16` subtracts `totalCents`, which already includes the coupon. The field name promises the tier saving, so every caller will read it that way; with a coupon it isn't.\n\n**Fix:** `addTax(gross) - addTax(sum of lineTotal)`, before the coupon.\n\n**Verify:** a 20-unit order with a 15 % coupon reports savings equal to 5 % of gross plus VAT.","choices":[{"id":"fix","label":"Fix in PR"},{"id":"ticket","label":"Ticket"},{"id":"decline","label":"Decline"}],"recommend":"fix"},{"id":"boundary-tests","text":"Tier tests stop short of both thresholds","sub":"Recommend fix in PR: The cases use 5 and 60 units, so they pass with the off-by-one.","state":"minor","stateKind":"info","detail":"**Reviewer:** the tests never touch a threshold.\n\n**My reasoning:** the three cases (`test/tiers.test.ts:5-15`) use 5 and 60 units. Neither sits on a threshold, so all three pass with the `>` bug present.\n\n**Fix:** four `it` cases in `test/tiers.test.ts`: 9 → none, 10 → 5 %, 49 → 5 %, 50 → 10 %.\n\n**Verify:** the 10 and 50 cases fail on the current head and pass after the `>=` fix.","choices":[{"id":"fix","label":"Fix in PR"},{"id":"ticket","label":"Ticket"},{"id":"decline","label":"Decline"}],"recommend":"fix"},{"id":"docs-stale","text":"`docs/pricing.md` still says there are no bulk discounts","sub":"Recommend ticket: The pricing spec needs a tier step; the PR is right without it.","state":"minor","stateKind":"info","detail":"**Reviewer:** `docs/pricing.md:11` still says \"There are no bulk discounts\".\n\n**My reasoning:** the doc is the pricing spec for every flow, and its order of operations (lines 5-9) needs a tier step, which is a product decision for PRICING-88's owner. This PR doesn't touch the file, and the code is right without it.\n\n**Fix:** a ticket for the PRICING-88 owner: add tiers to the order of operations (sum lines, apply tiers, apply coupon, add VAT).\n\n**Reply I'd post:** \"Agreed; ticketed (PRICING-91) so the spec change gets its own review.\"","choices":[{"id":"fix","label":"Fix in PR"},{"id":"ticket","label":"Ticket"},{"id":"decline","label":"Decline"}],"recommend":"ticket"},{"id":"tiers-map","text":"Turn `TIERS` into a `Map`","sub":"Recommend decline: It's a range lookup over 2 sorted tiers; a Map wouldn't remove the scan.","state":"nit","stateKind":"todo","detail":"**Reviewer:** a `Map` would make the lookup O(1).\n\n**My reasoning:** the lookup is a range match, not a key match: `tierFor(37)` needs the highest tier at or below 37, which a `Map` can't answer without the same scan. With 2 tiers the scan is free, and the array's order is the rule.\n\n**Reply I'd post:** \"Not taken: it's a range lookup over 2 sorted tiers, so a Map wouldn't remove the scan.\"","choices":[{"id":"fix","label":"Fix in PR"},{"id":"ticket","label":"Ticket"},{"id":"decline","label":"Decline"}],"recommend":"decline"},{"id":"pr-claims","text":"PR description says every tier is tested","sub":"Recommend resolve after the tests: The boundary tests make the sentence true; nothing else to change.","state":"nit","stateKind":"todo","detail":"**Reviewer:** the description says \"tests cover every tier\"; only the 10 % tier has a positive test.\n\n**My reasoning:** with the boundary tests, every tier and both thresholds are covered, so the sentence becomes accurate.\n\n**Reply I'd post:** \"Covered by the boundary tests in <sha>.\"","choices":[{"id":"after","label":"Resolve after the tests"},{"id":"fix","label":"Edit the description"}],"recommend":"after"}]},{"type":"diff","id":"diff-412","title":"acme-shop #412","repo":"acme-shop","base":"89efd8e","head":"62ccc86","paths":["src/orders/createOrder.ts","src/pricing/tiers.ts","test/tiers.test.ts"],"url":"https://github.com/acme/acme-shop/pull/412/files","note":"Only the commented files. Head `62ccc86`; `docs/pricing.md` is unchanged and shown for its comment.","comments":[{"item":"t412/tier-boundary","file":"src/pricing/tiers.ts","line":17},{"item":"t412/float-cents","file":"src/pricing/tiers.ts","line":25},{"item":"t412/savings-coupon","file":"src/orders/createOrder.ts","line":16},{"item":"t412/boundary-tests","file":"test/tiers.test.ts","line":5,"end":15},{"item":"t412/docs-stale","file":"docs/pricing.md","line":11},{"item":"t412/tiers-map","file":"src/pricing/tiers.ts","line":10,"end":13},{"label":"PR description","item":"t412/pr-claims"}],"files":[{"path":"docs/pricing.md","status":"context","add":0,"del":0,"hunks":[{"old":6,"new":6,"context":true,"lines":[" "," 1. Sum the cart lines."," 2. Apply the coupon, if any."," 3. Add VAT."," "," There are no bulk discounts: every unit costs the same."]}]},{"path":"src/orders/createOrder.ts","status":"modified","add":4,"del":1,"hunks":[{"old":6,"new":6,"lines":["   customerId: string;","   subtotalCents: number;","   totalCents: number;","+  bulkSavingsCents: number;"," }"," "," export function priceOrder(draft: OrderDraft, coupon?: Discount): PricedOrder {","+  const gross = draft.lines.reduce((sum, l) => sum + l.unitCents * l.qty, 0);","   const subtotalCents = applyCoupon(draft.lines, coupon);","   const totalCents = addTax(subtotalCents);","-  return { customerId: draft.customerId, subtotalCents, totalCents };","+  const bulkSavingsCents = addTax(gross) - totalCents;","+  return { customerId: draft.customerId, subtotalCents, totalCents, bulkSavingsCents };"," }"],"header":"export interface PricedOrder {"}]},{"path":"src/pricing/tiers.ts","status":"added","add":26,"del":0,"hunks":[{"old":0,"new":1,"lines":["+// Bulk discount tiers (PRICING-88).","+// Spec: 10 or more units of one SKU get 5 %, 50 or more get 10 %.","+import type { CartLine } from \"../orders/types\";","+","+export interface Tier {","+  minQty: number;","+  percent: number;","+}","+","+export const TIERS: Tier[] = [","+  { minQty: 50, percent: 10 },","+  { minQty: 10, percent: 5 },","+];","+","+/** The tier a line qualifies for, or undefined. */","+export function tierFor(qty: number): Tier | undefined {","+  return TIERS.find((t) => qty > t.minQty);","+}","+","+/** Line total in cents after its bulk tier. */","+export function lineTotal(line: CartLine): number {","+  const tier = tierFor(line.qty);","+  const gross = line.unitCents * line.qty;","+  if (!tier) return gross;","+  return gross * (1 - tier.percent / 100);","+}"]}]},{"path":"test/tiers.test.ts","status":"added","add":16,"del":0,"hunks":[{"old":0,"new":1,"lines":["+import { describe, expect, it } from \"vitest\";","+import { lineTotal, tierFor } from \"../src/pricing/tiers\";","+","+describe(\"bulk tiers\", () => {","+  it(\"gives no tier below 10 units\", () => {","+    expect(tierFor(5)).toBeUndefined();","+  });","+","+  it(\"gives 10 % at 60 units\", () => {","+    expect(tierFor(60)?.percent).toBe(10);","+  });","+","+  it(\"discounts the line total\", () => {","+    expect(lineTotal({ sku: \"A\", qty: 60, unitCents: 100 })).toBe(5400);","+  });","+});"]}]}]}]},{"id":"pr-415","title":"#415 · retry PayCo authorization","lead":"1 bug this PR introduces, 1 behaviour gap, 2 smaller comments. Diff: `main` `89efd8e` → head `0a46a97`, limited to the two commented files.","blocks":[{"type":"checklist","id":"t415","title":"Findings · #415","numbered":false,"items":[{"id":"double-auth","text":"A retry can authorize the card twice","sub":"Recommend fix in PR: A timeout after PayCo accepted the call becomes a second authorization.","state":"blocker","stateKind":"risk","detail":"**Reviewer:** the retry re-POSTs `/v2/authorizations` with no idempotency key. If the first call succeeds but the response times out, the retry authorizes the card again.\n\n**My reasoning:** `src/orders/charge.ts:17-21` sends only amount, currency and reference; `src/payments/paycoClient.ts` sets no default header. The 10 s client timeout makes \"accepted but timed out\" a realistic case. *Unverified:* that PayCo deduplicates on `Idempotency-Key`; their public docs say so, but I haven't seen it in the sandbox.\n\n**Fix:** pass `{ headers: { \"Idempotency-Key\": orderId } }` as the third argument to `payco.post`.\n\n**Verify (required):** in the PayCo sandbox, two calls with the same key return the same authorization id; the unit test asserts both attempts carry the same key.","choices":[{"id":"fix","label":"Fix in PR"},{"id":"ticket","label":"Ticket"},{"id":"decline","label":"Decline"}],"recommend":"fix"},{"id":"retry-4xx","text":"Card declines are retried too","sub":"Recommend fix in PR: The doc comment says network errors and 5xx; the `catch` retries everything.","state":"major","stateKind":"warn","detail":"**Reviewer:** a 402 decline is retried twice more, adding 750 ms before the customer sees it.\n\n**My reasoning:** the comment at `src/orders/charge.ts:12` promises \"network errors and 5xx\"; the `catch` at line 23 doesn't look at the status.\n\n**Fix:** in the `catch`, rethrow when `err.response?.status` is below 500.\n\n**Verify:** a test where the first call rejects with status 402 expects one call and a thrown error.","choices":[{"id":"fix","label":"Fix in PR"},{"id":"ticket","label":"Ticket"},{"id":"decline","label":"Decline"}],"recommend":"fix"},{"id":"latency","text":"Worst case blocks checkout for 31.5 s","sub":"Recommend ticket: Real, but the timeout budget is a checkout decision, not this PR's.","state":"minor","stateKind":"info","detail":"**Reviewer:** 3 attempts × 10 s timeout plus backoff is 31.5 s worst case, past checkout's 15 s gateway timeout.\n\n**My reasoning:** `src/payments/paycoClient.ts:5` sets 10 s for every PayCo call, including refunds. Lowering it here changes those too. The fix needs a budget from the checkout owners: per-attempt timeout, attempts, and what the customer sees when it runs out.\n\n**Reply I'd post:** \"Agreed it's too long; ticketed (PAY-34) so checkout can set the budget.\"","choices":[{"id":"fix","label":"Fix in PR"},{"id":"ticket","label":"Ticket"},{"id":"decline","label":"Decline"}],"recommend":"ticket"},{"id":"backoff-const","text":"Name the 250 ms backoff","sub":"Recommend decline: Used once, inside the loop it controls.","state":"nit","stateKind":"todo","detail":"**Reviewer:** `250 * attempt` is a magic number; make it a constant.\n\n**My reasoning:** the number appears once, inside the retry loop it controls (`src/orders/charge.ts:25`), and nothing else reads it. A constant would move it away from the only place it means anything.\n\n**Reply I'd post:** \"Not taken: it's used once, inside the loop it controls.\"","choices":[{"id":"fix","label":"Fix in PR"},{"id":"ticket","label":"Ticket"},{"id":"decline","label":"Decline"}],"recommend":"decline"}]},{"type":"diff","id":"diff-415","title":"acme-shop #415","repo":"acme-shop","base":"89efd8e","head":"0a46a97","paths":["src/orders/charge.ts","src/payments/paycoClient.ts"],"url":"https://github.com/acme/acme-shop/pull/415/files","note":"Only the two commented files; the new test is left out. Head `0a46a97`.","comments":[{"item":"t415/double-auth","file":"src/orders/charge.ts","line":17,"end":21},{"item":"t415/retry-4xx","file":"src/orders/charge.ts","line":23,"end":25},{"item":"t415/latency","file":"src/payments/paycoClient.ts","line":5},{"item":"t415/backoff-const","file":"src/orders/charge.ts","line":25}],"files":[{"path":"src/orders/charge.ts","status":"added","add":29,"del":0,"hunks":[{"old":0,"new":1,"lines":["+// Card authorization through PayCo, with retries (PAY-31).","+import { payco } from \"../payments/paycoClient\";","+import type { PricedOrder } from \"./createOrder\";","+","+export interface Authorization {","+  id: string;","+  amountCents: number;","+}","+","+const MAX_ATTEMPTS = 3;","+","+/** Authorizes the order total. Retries on network errors and 5xx. */","+export async function authorize(order: PricedOrder, orderId: string): Promise<Authorization> {","+  let lastError: unknown;","+  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {","+    try {","+      const res = await payco.post(\"/v2/authorizations\", {","+        amount: order.totalCents,","+        currency: \"EUR\",","+        reference: orderId,","+      });","+      return { id: res.data.id, amountCents: order.totalCents };","+    } catch (err) {","+      lastError = err;","+      await new Promise((r) => setTimeout(r, 250 * attempt));","+    }","+  }","+  throw lastError;","+}"]}]},{"path":"src/payments/paycoClient.ts","status":"added","add":7,"del":0,"hunks":[{"old":0,"new":1,"lines":["+import axios from \"axios\";","+","+export const payco = axios.create({","+  baseURL: process.env.PAYCO_URL,","+  timeout: 10_000,","+  headers: { Authorization: `Bearer ${process.env.PAYCO_KEY}` },","+});"]}]}]}]}]}</script>

  state: canvasId => { const cv = CANVASES[canvasId]; return cv && { k: cv.k, focus: cv.focusPath.map(n => n._key), revealed: cv.sysNodes.filter(n => n._reveal > 0.5).map(n => n._key), flow: cv.focusPlayer && cv.focusPlayer.flow && cv.focusPlayer.flow.id, step: cv.focusPlayer && cv.focusPlayer.si, tokens: [...cv.svg.querySelectorAll('.bp-tok')].filter(t => t.style.display !== 'none').length }; },
  progress: () => CHECKLISTS.map(c => ({ id: c.b.id, done: c.items.filter(x => x.cb.checked).length, total: c.items.length })),
  progressMarkdown: allChecklistsMd,
  replyPayload,
  approvePayload: note => approvePayload(note),
  planState,
  docType: DOC_TYPE,
  choose: (key, choice) => { const x = ITEMS[key]; if (!x || !x.setChoice) return false; x.setChoice(choice); return true; },
  setNote: (key, text) => { const x = ITEMS[key]; if (!x) return false; x.setNote(text || ''); return true; },
  openCode: (diffId, path, line) => openCode(diffId, path, line),
  openComment: (diffId, index) => { const d = DIFFS[diffId]; const c = d && d.order[index]; if (c) openComment(d, c, true); return !!c; },
  diffState: diffId => { const d = DIFFS[diffId]; if (!d) return null; const linked = d.comments.filter(c => c.item && ITEMS[c.item]);
    return { file: d.sel === PR_KEY ? null : d.sel, comment: d.ci, comments: d.comments.length, cards: d.pane.querySelectorAll('.bd-cm').length, lines: d.pane.querySelectorAll('.bd-ln').length, ticked: linked.filter(c => ITEMS[c.item].cb.checked).length, linked: linked.length }; },
  revisions: () => REVS.map(r => ({ rev: r.rev, date: r.date, current: !!r.current, shown: r === VIEW, changes: r.doc.changes || [] })),
  compare: () => BASE && { from: BASE.rev, to: VIEW.rev, changes: CHG.map(c => ({ kind: c.kind, label: plain(c.label) })) },
  annotations: () => MARKUP.all(),
  changesPayload: () => MARKUP.payload(),
  annotate: spec => MARKUP.annotate(spec),
  setMode: name => MARKUP.setMode(name),
  comments: opts => MARKUP.comments(opts),
  sidebar: opts => SIDE.api(opts),
};
})();
</script>
