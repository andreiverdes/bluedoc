<main class="shot" data-bd="streak">
  <h1 class="shot-cap" data-bd="cap" data-l10n="streak.title">Keep the streak going</h1>
  <div class="shot-frame" data-bd="frame">
    <div class="shot-ui" data-bd="ui">
      <main class="screen safe stack gap-4 center" data-bd="screen">
        <span class="label" data-bd="label">Current streak</span>
        <span class="num" data-bd="days" data-callout style="font-size:96px; line-height:1; color:var(--accent)">23</span>
        <span class="headline">days in a row</span>
        <section class="card stack gap-2" data-bd="weeks" style="width:100%">
          <div class="row between"><span>This week</span><span class="badge ok">7 / 7</span></div>
          <div class="row between"><span>Last week</span><span class="badge ok">7 / 7</span></div>
          <div class="row between"><span>Best streak</span><span class="num">41</span></div>
        </section>
        <button class="btn primary block" data-bd="remind">Remind me at 7:00</button>
      </main>
    </div>
  </div>
</main>
