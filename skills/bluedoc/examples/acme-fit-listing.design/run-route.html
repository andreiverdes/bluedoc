<main class="shot" data-bd="run-route">
  <h1 class="shot-cap" data-bd="cap" data-l10n="run-route.title">Plan a route before you go</h1>
  <div class="shot-frame" data-bd="frame">
    <div class="shot-ui" data-bd="ui">
      <main class="screen safe stack gap-4" data-bd="screen">
        <header class="row between" data-bd="head"><div class="stack gap-1"><span class="caption muted">New route</span><h2 class="title">Riverside loop</h2></div><span class="badge ok">Loop</span></header>
        <section class="card" data-bd="map" data-callout style="height:340px; padding:0; overflow:hidden; background:#e8f0e6">
          <svg viewBox="0 0 300 340" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <path d="M0 250 C80 230 120 280 300 240" stroke="#93c5fd" stroke-width="28" fill="none"/>
            <path d="M0 90 L300 60 M60 0 L90 340 M220 0 L200 340" stroke="#fff" stroke-width="9"/>
            <path d="M70 200 C70 140 110 110 150 110 S230 90 230 150 S200 220 150 215 S70 240 70 200 Z" fill="none" stroke="#1d4ed8" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="70" cy="200" r="9" fill="#16a34a"/><circle cx="150" cy="110" r="5" fill="#fff" stroke="#1d4ed8" stroke-width="3"/><circle cx="230" cy="150" r="5" fill="#fff" stroke="#1d4ed8" stroke-width="3"/></svg>
        </section>
        <section class="grid cols-3 gap-3" data-bd="stats">
          <div class="card kpi"><span class="label">Distance</span><span class="num">8.4</span><span class="caption muted">km</span></div>
          <div class="card kpi"><span class="label">Climb</span><span class="num">62</span><span class="caption muted">m</span></div>
          <div class="card kpi"><span class="label">At 5:20</span><span class="num">45</span><span class="caption muted">min</span></div>
        </section>
        <button class="btn primary block" data-bd="send">Send to watch</button>
      </main>
    </div>
  </div>
</main>
