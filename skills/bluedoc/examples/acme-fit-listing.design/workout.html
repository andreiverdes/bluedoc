<main class="shot" data-bd="workout">
  <h1 class="shot-cap" data-bd="cap" data-l10n="workout.title">Every run, mapped</h1>
  <div class="shot-frame" data-bd="frame">
    <div class="shot-ui" data-bd="ui">
      <main class="screen safe stack gap-4" data-bd="screen">
        <header class="stack gap-1" data-bd="head"><span class="caption muted">Morning run</span><h2 class="title">5.0 km</h2></header>
        <section class="card" data-bd="map" style="height:260px; padding:0; overflow:hidden; background:#e8f0e6">
          <svg viewBox="0 0 300 260" width="100%" height="100%" aria-hidden="true"><path d="M0 70 L300 40 M0 180 L300 210 M90 0 L120 260 M210 0 L190 260" stroke="#fff" stroke-width="10"/>
            <path d="M40 210 C70 150 60 110 110 95 S190 120 200 70 S250 40 262 60" fill="none" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
            <circle cx="40" cy="210" r="8" fill="#16a34a"/><circle cx="262" cy="60" r="8" fill="#dc2626"/></svg>
        </section>
        <section class="grid cols-3 gap-3" data-bd="stats" data-callout>
          <div class="card kpi"><span class="label">Time</span><span class="num">26:41</span></div>
          <div class="card kpi"><span class="label">Pace</span><span class="num">5:20</span><span class="caption muted">/km</span></div>
          <div class="card kpi"><span class="label">Heart</span><span class="num">148</span><span class="caption muted">bpm</span></div>
        </section>
        <button class="btn primary block" data-bd="share">Share the run</button>
      </main>
    </div>
  </div>
</main>
