<main class="shot" data-bd="today-lifestyle">
  <h1 class="shot-cap" data-bd="cap" data-l10n="today-lifestyle.title">Your week, on the move</h1>
  <div class="shot-frame" data-bd="frame">
    <div class="shot-ui" data-bd="ui">
      <main class="screen safe stack gap-4" data-bd="screen">
        <header class="row between" data-bd="greeting">
          <div class="stack gap-1"><span class="caption muted">Saturday 10 October</span><h2 class="title">This week</h2></div>
          <span class="avatar" data-bd="avatar">AF</span>
        </header>
        <section class="card stack center gap-3" data-bd="steps" data-callout>
          <div class="ring" style="--v:.72; --size: 168px; --thick: 14px"><div class="stack center"><span class="num" style="font-size:34px">51,214</span><span class="caption muted">of 70,000 steps</span></div></div>
          <span class="badge ok">72% of the week's goal</span>
        </section>
        <section class="grid cols-3 gap-3" data-bd="stats">
          <div class="card kpi"><span class="label">Runs</span><span class="num">4</span><span class="caption muted">this week</span></div>
          <div class="card kpi"><span class="label">Rides</span><span class="num">2</span><span class="caption muted">this week</span></div>
          <div class="card kpi"><span class="label">Sleep</span><span class="num">7.4</span><span class="caption muted">h a night</span></div>
        </section>
        <section class="card stack gap-2" data-bd="days">
          <span class="label">Active minutes</span>
          <div class="row gap-2" style="align-items:flex-end; height:72px">
            <i style="flex:1; height:40%; background:var(--accent); border-radius:4px"></i><i style="flex:1; height:70%; background:var(--accent); border-radius:4px"></i>
            <i style="flex:1; height:55%; background:var(--accent); border-radius:4px"></i><i style="flex:1; height:90%; background:var(--accent); border-radius:4px"></i>
            <i style="flex:1; height:30%; background:var(--accent); border-radius:4px"></i><i style="flex:1; height:80%; background:var(--accent); border-radius:4px"></i>
            <i style="flex:1; height:62%; background:var(--accent); border-radius:4px; opacity:.5"></i>
          </div>
        </section>
      </main>
    </div>
  </div>
</main>
