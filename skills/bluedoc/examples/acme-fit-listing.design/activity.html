<main class="shot" data-bd="activity">
  <h1 class="shot-cap" data-bd="cap" data-l10n="activity.title">Steps and minutes, day by day</h1>
  <div class="shot-frame" data-bd="frame">
    <div class="shot-ui" data-bd="ui">
      <main class="screen safe stack gap-4" data-bd="screen">
        <header class="stack gap-2" data-bd="head">
          <h2 class="title">Activity</h2>
          <div class="row gap-2"><span class="chip">Day</span><span class="chip active">Week</span><span class="chip">Month</span></div>
        </header>
        <section class="card stack gap-3" data-bd="steps" data-callout>
          <div class="stack gap-1"><span class="label">Steps this week</span><span class="num" style="font-size:34px">55,314</span></div>
          <div class="row gap-2" style="align-items:flex-end; height:140px">
            <i style="flex:1; height:48%; background:color-mix(in srgb, var(--accent) 35%, var(--surface)); border-radius:6px 6px 2px 2px"></i>
            <i style="flex:1; height:74%; background:color-mix(in srgb, var(--accent) 35%, var(--surface)); border-radius:6px 6px 2px 2px"></i>
            <i style="flex:1; height:61%; background:color-mix(in srgb, var(--accent) 35%, var(--surface)); border-radius:6px 6px 2px 2px"></i>
            <i style="flex:1; height:92%; background:color-mix(in srgb, var(--accent) 35%, var(--surface)); border-radius:6px 6px 2px 2px"></i>
            <i style="flex:1; height:38%; background:color-mix(in srgb, var(--accent) 35%, var(--surface)); border-radius:6px 6px 2px 2px"></i>
            <i style="flex:1; height:86%; background:var(--accent); border-radius:6px 6px 2px 2px"></i>
            <i style="flex:1; height:20%; background:var(--surface); border-radius:6px 6px 2px 2px"></i>
          </div>
          <div class="row between caption muted"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
        </section>
        <section class="grid cols-3 gap-3" data-bd="stats">
          <div class="card kpi"><span class="label">Active</span><span class="num">286</span><span class="caption muted">min</span></div>
          <div class="card kpi"><span class="label">Distance</span><span class="num">38.2</span><span class="caption muted">km</span></div>
          <div class="card kpi"><span class="label">Resting</span><span class="num">58</span><span class="caption muted">bpm</span></div>
        </section>
      </main>
    </div>
  </div>
</main>
