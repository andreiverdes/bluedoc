<main class="shot" data-bd="profile">
  <h1 class="shot-cap" data-bd="cap" data-l10n="profile.title">Your records in one place</h1>
  <div class="shot-frame" data-bd="frame">
    <div class="shot-ui" data-bd="ui">
      <main class="screen safe stack gap-4" data-bd="screen">
        <header class="stack center gap-2" data-bd="head"><span class="avatar" style="width:72px; height:72px; font-size:26px">AF</span><h2 class="title">Acme Fit member</h2><span class="caption muted">you@acme.test · since March</span></header>
        <section class="grid cols-3 gap-3" data-bd="records" data-callout>
          <div class="card kpi"><span class="label">Workouts</span><span class="num">128</span></div>
          <div class="card kpi"><span class="label">Streak</span><span class="num">12 d</span></div>
          <div class="card kpi"><span class="label">Best day</span><span class="num">14.2k</span></div>
        </section>
        <section class="card" data-bd="settings">
          <div class="list">
            <div class="item"><span class="grow">Daily goal</span><span class="muted">10,000 steps ›</span></div>
            <div class="item"><span class="grow">Devices</span><span class="muted">Acme Watch ›</span></div>
            <div class="item"><span class="grow">Friends</span><span class="muted">8 ›</span></div>
          </div>
        </section>
      </main>
    </div>
  </div>
</main>
