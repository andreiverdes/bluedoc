<main class="shot" data-bd="sleep">
  <h1 class="shot-cap" data-bd="cap" data-l10n="sleep.title">See how well you slept</h1>
  <div class="shot-frame" data-bd="frame">
    <div class="shot-ui" data-bd="ui" style="--bg:#0f172a; --fg:#e2e8f0; --surface:#1e293b; --border:#334155; --muted:#94a3b8">
      <main class="screen safe stack gap-4" data-bd="screen">
        <header class="stack gap-1" data-bd="head"><span class="caption muted">Last night · 23:10 to 06:48</span><h2 class="title">7 h 38 min</h2></header>
        <section class="card stack gap-2" data-bd="stages" data-callout>
          <span class="label">Stages</span>
          <div class="row" style="height:120px; align-items:stretch; gap:3px">
            <i style="flex:2; background:#818cf8; margin-top:40px; border-radius:4px"></i><i style="flex:3; background:#4f46e5; margin-top:80px; border-radius:4px"></i>
            <i style="flex:2; background:#818cf8; margin-top:40px; border-radius:4px"></i><i style="flex:1; background:#c4b5fd; border-radius:4px; margin-bottom:60px"></i>
            <i style="flex:3; background:#818cf8; margin-top:40px; border-radius:4px"></i><i style="flex:2; background:#4f46e5; margin-top:80px; border-radius:4px"></i>
            <i style="flex:2; background:#c4b5fd; border-radius:4px; margin-bottom:60px"></i><i style="flex:3; background:#818cf8; margin-top:40px; border-radius:4px"></i>
          </div>
          <div class="row between caption muted"><span>23:10</span><span>03:00</span><span>06:48</span></div>
        </section>
        <section class="grid cols-3 gap-3" data-bd="stats">
          <div class="card kpi"><span class="label">Deep</span><span class="num">1:24</span><span class="caption muted">h</span></div>
          <div class="card kpi"><span class="label">REM</span><span class="num">1:52</span><span class="caption muted">h</span></div>
          <div class="card kpi"><span class="label">Resting</span><span class="num">54</span><span class="caption muted">bpm</span></div>
        </section>
        <span class="badge ok" data-bd="note">22 min more than your week's average</span>
      </main>
    </div>
  </div>
</main>
