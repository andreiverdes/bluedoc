        <div class="row gap-1" data-bd="week" style="margin-top:8px">
          <i style="width:14px; height:14px; border-radius:50%; background:#f59e0b"></i><i style="width:14px; height:14px; border-radius:50%; background:#f59e0b"></i>
          <i style="width:14px; height:14px; border-radius:50%; background:#f59e0b"></i><i style="width:14px; height:14px; border-radius:50%; background:#f59e0b"></i>
          <i style="width:14px; height:14px; border-radius:50%; background:#f59e0b"></i><i style="width:14px; height:14px; border-radius:50%; background:#f59e0b"></i>
          <i style="width:14px; height:14px; border-radius:50%; border:2px solid #f59e0b; box-sizing:border-box"></i>
        </div>
      </main>
    </div>
  </div>
</main>
