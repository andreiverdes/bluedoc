<main class="asset" data-bd="ad-wide" style="justify-content:space-between; gap:48px; padding:0 72px; background:linear-gradient(120deg, var(--brand-bg), color-mix(in oklch, var(--brand-bg), var(--brand-accent) 30%))">
  <div class="stack gap-3" data-bd="copy" style="max-width:560px">
    <h1 class="asset-title" data-bd="title" data-l10n="ad-wide.title">Your week of runs in one view</h1>
    <p class="asset-sub" data-bd="sub" data-l10n="ad-wide.sub">Steps, workouts and sleep, side by side</p>
  </div>
  <div class="ring" data-bd="ring" style="--v:.72; --size: 300px; --thick: 26px; flex:none"><div class="stack center"><span class="num" style="font-size:56px; color:var(--brand-bg)">72%</span><span class="caption" style="color:var(--brand-bg)">of the week's goal</span></div></div>
</main>
