<main class="shot" data-bd="workouts">
  <h1 class="shot-cap" data-bd="cap" data-l10n="workouts.title">Runs, rides and lifts in one log</h1>
  <div class="shot-frame" data-bd="frame">
    <div class="shot-ui" data-bd="ui">
      <main class="screen safe stack gap-4" data-bd="screen">
        <header class="stack gap-2" data-bd="head">
          <h2 class="title">Workouts</h2>
          <div class="row gap-2"><span class="chip active">All</span><span class="chip">Run</span><span class="chip">Strength</span><span class="chip">Ride</span></div>
        </header>
        <section class="card" data-bd="log" data-callout>
          <div class="list">
            <div class="item"><span class="avatar">R</span><div class="stack grow"><b>Morning run</b><span class="caption muted">Today · 5.2 km · 28 min</span></div><span class="muted">›</span></div>
            <div class="item"><span class="avatar">S</span><div class="stack grow"><b>Strength</b><span class="caption muted">Thu · 6 sets · 41 min</span></div><span class="muted">›</span></div>
            <div class="item"><span class="avatar">W</span><div class="stack grow"><b>Evening walk</b><span class="caption muted">Wed · 3.1 km · 35 min</span></div><span class="muted">›</span></div>
            <div class="item"><span class="avatar">C</span><div class="stack grow"><b>Cycling</b><span class="caption muted">Mon · 18.4 km · 52 min</span></div><span class="muted">›</span></div>
            <div class="item"><span class="avatar">R</span><div class="stack grow"><b>Long run</b><span class="caption muted">Sun · 12.0 km · 68 min</span></div><span class="muted">›</span></div>
          </div>
        </section>
        <button class="btn primary block" data-bd="start">Start a workout</button>
      </main>
    </div>
  </div>
</main>
