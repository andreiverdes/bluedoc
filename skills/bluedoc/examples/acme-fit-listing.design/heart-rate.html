<main class="shot" data-bd="heart-rate">
  <h1 class="shot-cap" data-bd="cap" data-l10n="heart-rate.title">Train in the right zone</h1>
  <div class="shot-frame" data-bd="frame">
    <div class="shot-ui" data-bd="ui">
      <main class="screen safe stack gap-4" data-bd="screen">
        <header class="stack gap-1" data-bd="head"><span class="caption muted">Morning run · heart rate</span><h2 class="title">148 bpm average</h2></header>
        <section class="card" data-bd="chart" style="height:180px; padding:12px">
          <svg viewBox="0 0 300 150" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true">
            <rect x="0" y="0" width="300" height="40" fill="#fee2e2"/><rect x="0" y="40" width="300" height="45" fill="#ffedd5"/><rect x="0" y="85" width="300" height="65" fill="#dcfce7"/>
            <path d="M0 130 C30 110 40 70 70 66 S110 52 140 58 S190 40 220 48 S270 70 300 90" fill="none" stroke="#dc2626" stroke-width="4"/></svg>
        </section>
        <section class="card stack gap-3" data-bd="zones" data-callout>
          <span class="label">Time in zones</span>
          <div class="stack gap-1"><div class="row between"><span>Zone 5 · peak</span><span class="num">2 min</span></div><div class="progress"><span style="--v:.07; background:#dc2626"></span></div></div>
          <div class="stack gap-1"><div class="row between"><span>Zone 4 · threshold</span><span class="num">9 min</span></div><div class="progress"><span style="--v:.32; background:#f97316"></span></div></div>
          <div class="stack gap-1"><div class="row between"><span>Zone 3 · aerobic</span><span class="num">14 min</span></div><div class="progress"><span style="--v:.52; background:#16a34a"></span></div></div>
          <div class="stack gap-1"><div class="row between"><span>Zone 2 · easy</span><span class="num">3 min</span></div><div class="progress"><span style="--v:.11; background:#22c55e"></span></div></div>
        </section>
      </main>
    </div>
  </div>
</main>
