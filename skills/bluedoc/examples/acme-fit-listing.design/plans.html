<main class="shot" data-bd="plans">
  <h1 class="shot-cap" data-bd="cap" data-l10n="plans.title">A 5K plan that fits your week</h1>
  <div class="shot-frame" data-bd="frame">
    <div class="shot-ui" data-bd="ui">
      <main class="screen safe stack gap-4" data-bd="screen">
        <header class="stack gap-1" data-bd="head"><span class="caption muted">Plan · week 3 of 8</span><h2 class="title">First 5K</h2></header>
        <section class="card stack gap-2" data-bd="progress"><div class="row between"><span class="label">Plan done</span><span class="num">31%</span></div><div class="progress"><span style="--v:.31"></span></div></section>
        <section class="card" data-bd="week" data-callout>
          <div class="list">
            <div class="item"><span class="badge ok">Done</span><div class="stack grow"><b>Easy run</b><span class="caption muted">Mon · 3 km</span></div></div>
            <div class="item"><span class="badge ok">Done</span><div class="stack grow"><b>Intervals</b><span class="caption muted">Wed · 6 × 400 m</span></div></div>
            <div class="item"><span class="badge warn">Today</span><div class="stack grow"><b>Tempo run</b><span class="caption muted">Fri · 20 min</span></div></div>
            <div class="item"><span class="badge">Sun</span><div class="stack grow"><b>Long run</b><span class="caption muted">Sun · 5 km</span></div></div>
          </div>
        </section>
        <button class="btn primary block" data-bd="move">Move a run</button>
      </main>
    </div>
  </div>
</main>
