<style>
  .today-ring { --size: 176px; --thick: 14px; }
  .today-ring .num { font-size: 36px; line-height: 1.1; }
</style>
<main class="screen safe stack gap-4" data-bd="today">
  <header class="row between" data-bd="greeting">
    <div class="stack gap-1">
      <span class="caption muted">Saturday 10 October</span>
      <h1 class="title">Today</h1>
    </div>
    <span class="avatar" data-bd="avatar">AF</span>
  </header>
  <section class="card stack center gap-3" data-bd="steps">
    <div class="ring today-ring" style="--v:.72">
      <div class="stack center">
        <span class="num">7,214</span>
        <span class="caption muted">of 10,000 steps</span>
      </div>
    </div>
    <span class="badge ok">72% of your goal</span>
  </section>
  <section class="grid cols-3 gap-3" data-bd="stats">
    <div class="card kpi" data-bd="active"><span class="label">Active</span><span class="num">42</span><span class="caption muted">min</span></div>
    <div class="card kpi" data-bd="heart"><span class="label">Heart</span><span class="num">68</span><span class="caption muted">bpm</span></div>
    <div class="card kpi" data-bd="distance"><span class="label">Distance</span><span class="num">5.4</span><span class="caption muted">km</span></div>
  </section>
  <button class="btn primary block" data-bd="start-workout" data-nav="workout" data-nav-label="Tap Start workout">Start workout</button>
  <nav class="tabbar" data-bd="tabs">
    <a class="tab active" data-bd="tab-today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>Today</a>
    <a class="tab" data-bd="tab-activity" data-nav="tab:activity"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 19v-8M12 19V5M19 19v-6"/></svg>Activity</a>
    <a class="tab" data-bd="tab-workouts" data-nav="tab:workouts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9v6M8 7v10M16 7v10M20 9v6M8 12h8"/></svg>Workouts</a>
    <a class="tab" data-bd="tab-profile" data-nav="tab:profile"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</a>
  </nav>
</main>
