<main class="screen safe stack gap-4" data-bd="login">
  <div class="wf-circle" data-label="Logo" data-bd="logo"></div>
  <div class="wf-text" style="--lines:2" data-bd="headline"></div>
  <button class="btn primary block" data-bd="passkey" data-nav="replace:today" data-nav-label="Tap Sign in with a passkey">Sign in with a passkey</button>
  <div class="wf-line" data-bd="divider"></div>
  <div class="wf-box" data-label="Email field" data-bd="email"></div>
  <button class="btn block" data-bd="submit">Use email instead</button>
</main>
