<style>
  .face { --bg: #000; --fg: #fff; --muted: #9ca3af; --border: #1f2937; }
  .face .ring { --size: 224px; --thick: 10px; }
  .face .display { font-size: 52px; }
</style>
<main class="screen round stack center face" data-bd="face">
  <div class="ring" style="--v:.72" data-bd="steps-ring">
    <div class="stack center gap-1">
      <div class="display num" data-bd="time">10:09</div>
      <div class="caption muted" data-bd="date">Sat 10 Oct</div>
      <div class="row gap-4">
        <div class="stack center" data-bd="steps"><span class="num">7,214</span><span class="caption muted">steps</span></div>
        <div class="stack center" data-bd="heart"><span class="num">68</span><span class="caption muted">bpm</span></div>
      </div>
    </div>
  </div>
</main>
