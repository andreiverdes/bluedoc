<main class="screen safe stack gap-4" data-bd="login">
  <div class="stack gap-2" data-bd="brand">
    <span class="badge">Acme Fit</span>
    <h1 class="title">Welcome back</h1>
    <p class="body muted">Sign in to sync today's steps and workouts.</p>
  </div>
  <label class="stack gap-1"><span class="label">Email</span>
    <input class="field" type="email" placeholder="you@acme.test" data-bd="email">
  </label>
  <label class="stack gap-1"><span class="label">Password</span>
    <input class="field" type="password" placeholder="••••••••" data-bd="password">
  </label>
  <button class="btn primary block" data-bd="submit">Sign in</button>
  <button class="btn block" data-bd="passkey">Use a passkey</button>
  <button class="btn ghost sm" data-bd="forgot">Forgot your password?</button>
</main>
