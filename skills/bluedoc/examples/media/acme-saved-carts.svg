<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">Saved carts wireframe</title>
  <desc id="d">The Acme Shop cart page with a Save cart popover under the cart, and a new Saved carts panel on the right listing three saved carts, one flagged Prices changed.</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .bg { fill: #f4f5f7; }
    .surface { fill: #ffffff; }
    .faint { fill: #e9ecf1; }
    .line { stroke: #d5d9e0; }
    .fline { fill: #d5d9e0; }
    .txt { fill: #1f2430; }
    .muted { fill: #6b7280; }
    .ink { fill: #2b3240; }
    .onink { fill: #ffffff; }
    .accent { fill: #2563eb; }
    .saccent { stroke: #2563eb; }
    .accentsoft { fill: #e3ecfd; }
    .onaccent { fill: #ffffff; }
    .amber { fill: #a15c07; }
    .ambersoft { fill: #fcefd8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #171a21; }
      .surface { fill: #1f232c; }
      .faint { fill: #2a2f3a; }
      .line { stroke: #3a404d; }
      .fline { fill: #3a404d; }
      .txt { fill: #e6e9ef; }
      .muted { fill: #9aa3b2; }
      .ink { fill: #e6e9ef; }
      .onink { fill: #171a21; }
      .accent { fill: #7aa7ff; }
      .saccent { stroke: #7aa7ff; }
      .accentsoft { fill: #1d2840; }
      .onaccent { fill: #0d1526; }
      .amber { fill: #f0b45a; }
      .ambersoft { fill: #3a2c17; }
    }
    .h { font-weight: 650; }
    .sb { font-weight: 600; }
  </style>
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="960" height="600" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect class="bg" x="0" y="0" width="960" height="600"/>

    <!-- browser chrome -->
    <rect class="faint" x="0" y="0" width="960" height="40"/>
    <circle class="fline" cx="24" cy="20" r="5"/>
    <circle class="fline" cx="42" cy="20" r="5"/>
    <circle class="fline" cx="60" cy="20" r="5"/>
    <rect class="surface" x="300" y="9" width="360" height="22" rx="11"/>
    <text class="muted" x="480" y="24.5" font-size="12" text-anchor="middle">shop.acme.example/cart</text>

    <!-- site header -->
    <rect class="surface" x="0" y="40" width="960" height="56"/>
    <rect class="fline" x="0" y="95" width="960" height="1"/>
    <rect class="ink" x="32" y="54" width="28" height="28" rx="7"/>
    <text class="onink h" x="46" y="73" font-size="14" text-anchor="middle">A</text>
    <text class="txt h" x="70" y="73.5" font-size="16">Acme Shop</text>
    <text class="muted" x="620" y="73" font-size="13">Shop</text>
    <text class="muted" x="672" y="73" font-size="13">Deals</text>
    <text class="muted" x="728" y="73" font-size="13">Orders</text>
    <rect class="faint" x="842" y="56" width="40" height="24" rx="12"/>
    <text class="txt sb" x="862" y="72.5" font-size="12" text-anchor="middle">3</text>
    <circle class="faint" cx="912" cy="68" r="14"/>
    <text class="muted sb" x="912" y="72.5" font-size="11" text-anchor="middle">JD</text>

    <!-- cart panel -->
    <rect class="surface line" x="32.5" y="120.5" width="552" height="447" rx="12"/>
    <text class="txt h" x="56" y="156" font-size="18">Your cart</text>
    <text class="muted" x="560" y="156" font-size="13" text-anchor="end">3 items</text>

    <g>
      <rect class="faint" x="56" y="178" width="48" height="48" rx="8"/>
      <text class="txt sb" x="120" y="197" font-size="14">Thermal labels, 4×6 in</text>
      <text class="muted" x="120" y="216" font-size="12">Roll of 500 · LB-460</text>
      <rect class="line" x="400.5" y="189.5" width="72" height="26" rx="13" fill="none"/>
      <text class="txt" x="436.5" y="207" font-size="13" text-anchor="middle">−  4  +</text>
      <text class="txt sb" x="560" y="207" font-size="14" text-anchor="end">$71.60</text>
    </g>
    <rect class="fline" x="56" y="240" width="504" height="1"/>
    <g>
      <rect class="faint" x="56" y="254" width="48" height="48" rx="8"/>
      <text class="txt sb" x="120" y="273" font-size="14">Packing tape, clear</text>
      <text class="muted" x="120" y="292" font-size="12">Case of 36 · PT-036</text>
      <rect class="line" x="400.5" y="265.5" width="72" height="26" rx="13" fill="none"/>
      <text class="txt" x="436.5" y="283" font-size="13" text-anchor="middle">−  1  +</text>
      <text class="txt sb" x="560" y="283" font-size="14" text-anchor="end">$54.00</text>
    </g>
    <rect class="fline" x="56" y="316" width="504" height="1"/>
    <g>
      <rect class="faint" x="56" y="330" width="48" height="48" rx="8"/>
      <text class="txt sb" x="120" y="349" font-size="14">Shipping boxes, medium</text>
      <text class="muted" x="120" y="368" font-size="12">Bundle of 25 · BX-M25</text>
      <rect class="line" x="400.5" y="341.5" width="72" height="26" rx="13" fill="none"/>
      <text class="txt" x="436.5" y="359" font-size="13" text-anchor="middle">−  2  +</text>
      <text class="txt sb" x="560" y="359" font-size="14" text-anchor="end">$63.90</text>
    </g>
    <rect class="fline" x="56" y="392" width="504" height="1"/>
    <text class="muted" x="56" y="420" font-size="14">Subtotal</text>
    <text class="txt h" x="560" y="420" font-size="16" text-anchor="end">$189.50</text>

    <!-- new: Save cart button -->
    <rect class="accentsoft saccent" x="56.5" y="440.5" width="150" height="40" rx="10" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path class="saccent" d="M79 452 h10 v17 l-5 -4 l-5 4 z" fill="none" stroke-width="1.6" stroke-linejoin="round"/>
    <text class="accent sb" x="98" y="465" font-size="14">Save cart</text>
    <rect class="ink" x="400" y="440" width="160" height="40" rx="10"/>
    <text class="onink sb" x="480" y="465" font-size="14" text-anchor="middle">Checkout</text>

    <!-- new: name popover -->
    <path class="surface saccent" d="M124 496.5 l8 -8 l8 8" stroke-width="1.5"/>
    <rect class="surface saccent" x="56.5" y="496.5" width="330" height="58" rx="10" stroke-width="1.5"/>
    <rect class="surface" x="123" y="495" width="18" height="4"/>
    <rect class="bg line" x="68.5" y="507.5" width="210" height="36" rx="8"/>
    <text class="txt" x="80" y="530" font-size="13">Office restock</text>
    <rect class="accent" x="288" y="507" width="86" height="37" rx="8"/>
    <text class="onaccent sb" x="331" y="530" font-size="13" text-anchor="middle">Save</text>

    <!-- new: saved carts panel -->
    <rect class="surface saccent" x="608.5" y="120.5" width="320" height="447" rx="12" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="txt h" x="632" y="156" font-size="18">Saved carts</text>
    <rect class="accentsoft" x="856" y="141" width="48" height="20" rx="10"/>
    <text class="accent h" x="880" y="155" font-size="11" text-anchor="middle" letter-spacing="0.6">NEW</text>

    <g>
      <rect class="bg line" x="624.5" y="176.5" width="288" height="96" rx="10"/>
      <text class="txt sb" x="640" y="203" font-size="14">Office restock</text>
      <text class="muted" x="640" y="223" font-size="12">3 items · $189.50 · saved 3 Oct</text>
      <rect class="surface line" x="820.5" y="234.5" width="76" height="28" rx="8"/>
      <text class="txt sb" x="858.5" y="253" font-size="12" text-anchor="middle">Restore</text>
      <text class="muted h" x="896" y="203" font-size="14" text-anchor="end">···</text>
    </g>
    <g>
      <rect class="bg line" x="624.5" y="284.5" width="288" height="96" rx="10"/>
      <text class="txt sb" x="640" y="311" font-size="14">Warehouse B monthly</text>
      <text class="muted" x="640" y="331" font-size="12">8 items · $642.10 · saved 21 Sep</text>
      <rect class="ambersoft" x="640" y="344" width="112" height="22" rx="11"/>
      <circle class="amber" cx="653" cy="355" r="3.5"/>
      <text class="amber sb" x="662" y="359" font-size="11">Prices changed</text>
      <rect class="surface line" x="820.5" y="342.5" width="76" height="28" rx="8"/>
      <text class="txt sb" x="858.5" y="361" font-size="12" text-anchor="middle">Restore</text>
      <text class="muted h" x="896" y="311" font-size="14" text-anchor="end">···</text>
    </g>
    <g>
      <rect class="bg line" x="624.5" y="392.5" width="288" height="96" rx="10"/>
      <text class="txt sb" x="640" y="419" font-size="14">Holiday packaging</text>
      <text class="muted" x="640" y="439" font-size="12">5 items · $118.75 · saved 2 Sep</text>
      <rect class="surface line" x="820.5" y="450.5" width="76" height="28" rx="8"/>
      <text class="txt sb" x="858.5" y="469" font-size="12" text-anchor="middle">Restore</text>
      <text class="muted h" x="896" y="419" font-size="14" text-anchor="end">···</text>
    </g>
    <rect class="fline" x="632" y="508" width="272" height="1"/>
    <text class="muted" x="632" y="534" font-size="12">3 of 20 saved · kept 180 days after last use</text>
  </g>
  <rect class="line" x="0.5" y="0.5" width="959" height="599" rx="14" fill="none"/>
</svg>
