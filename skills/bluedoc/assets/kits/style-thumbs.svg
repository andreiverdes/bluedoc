<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 104">
<!-- bluedoc style thumbnails: the Style pane (template.html renderListing) shows one symbol per screenshot style,
     st-<style>, or st-<style>-<platform> where the App Store and Google Play forms differ (M4, L1, L5). They draw in
     the brand's colours, the pane's custom properties tb-bg, tb-surface, tb-accent, tb-text and tb-caption. 60 × 104. -->
<defs>
  <g id="st-cap"><rect x="10" y="9" width="40" height="5" rx="2" fill="var(--tb-caption, #fff)"/><rect x="15" y="17" width="30" height="5" rx="2" fill="var(--tb-caption, #fff)"/></g>
  <g id="st-ui"><rect x="0" y="0" width="30" height="64" rx="4" fill="#fff"/><rect x="4" y="6" width="22" height="3" rx="1.5" fill="#cbd5e1"/>
    <rect x="4" y="13" width="22" height="16" rx="3" fill="#e2e8f0"/><rect x="4" y="33" width="10" height="10" rx="2" fill="#e2e8f0"/><rect x="16" y="33" width="10" height="10" rx="2" fill="#e2e8f0"/>
    <rect x="4" y="47" width="22" height="3" rx="1.5" fill="#cbd5e1"/><rect x="4" y="53" width="16" height="3" rx="1.5" fill="#cbd5e1"/></g>
  <g id="st-phone"><rect x="13" y="30" width="34" height="80" rx="6" fill="#15171c"/><use href="#st-ui" x="15" y="32"/></g>
  <g id="st-card"><rect x="13" y="30" width="34" height="80" rx="6" fill="var(--tb-surface, #eef2ff)" opacity=".9"/><use href="#st-ui" x="15" y="32"/></g>
