<!doctype html>
<html lang="en" class="{{html_class}}" data-bd-artboard="{{artboard}}" data-bd-fallback="{{fallback}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<style id="bd-shell">
@font-face { font-family: "Architects Daughter"; font-style: normal; font-weight: 400; font-display: block; src: url("{{hand_font}}") format("woff2"); }
html:root { {{vars}} }
html, body { margin: 0; min-height: 100%; }
#bd-notice { position: fixed; top: 0; left: 0; right: 0; z-index: 2147483646; padding: 6px 10px; font: 600 12px/1.3 system-ui, sans-serif;
  background: #fef3c7; color: #92400e; border-bottom: 1px solid #f59e0b; pointer-events: none; }
html.bd-sketch body, html.fid-sketch body { filter: url(#bd-wobble); }
html.bd-sketch body *, html.fid-sketch body * { font-family: "Architects Daughter", var(--font, system-ui), sans-serif !important; }
html.bd-reduced *, html.bd-reduced *::before, html.bd-reduced *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; transition-duration: 0s !important; }
html.bd-paused *, html.bd-paused *::before, html.bd-paused *::after { animation-play-state: paused !important; }
</style>
<style id="bd-tokens"></style>
{{inspector}}
{{head}}
</head>
<body>
{{notice}}{{body}}
<svg id="bd-kit-svg" width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="bd-wobble"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></svg>
</body>
</html>
