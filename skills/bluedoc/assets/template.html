.bd-selm .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.bd-selm .m { flex: none; margin-left: 12px; font-size: 11.5px; font-weight: 500; color: var(--fg-subtle); }
.bd-selm [aria-disabled="true"] { opacity: .45; cursor: default; }
.bd-selm [aria-disabled="true"]:hover { background: none; }
.bd-expm .t { display: grid; }
.bd-expm .t b { font-size: 13.5px; font-weight: 600; }
.bd-expm .t span { color: var(--fg-subtle); }
/* a deck's Include unapplied edits: a checkbox row under the exports */
.bd-expm .sep { height: 1px; margin: 3px 6px; background: var(--line-soft); }
.bd-expm button.opt { gap: 10px; padding: 7px 10px; color: var(--fg-muted); }
.bd-expm .opt .bx { flex: none; display: grid; place-items: center; width: 16px; height: 16px; margin: 0 2px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.bd-expm .opt .bx .bd-ic { width: 11px; height: 11px; color: #fff; stroke-width: 3.2; visibility: hidden; }
.bd-expm .opt[aria-checked="true"] { color: var(--fg); }
.bd-expm .opt[aria-checked="true"] .bx { background: var(--accent-solid); box-shadow: none; }
.bd-expm .opt[aria-checked="true"] .bx .bd-ic { visibility: visible; }
/* the left panel: the doc's header, then Screens (the artboards); a storelisting's, its tabs (Text, Style, Colors, Checks) */
.bd-lp { position: fixed; z-index: 41; top: var(--top-h); left: 0; bottom: 0; width: var(--lp-w); display: flex; flex-direction: column; min-height: 0;
  background: var(--panel); box-shadow: inset -1px 0 0 var(--line); transform: translateX(-100%); visibility: hidden; transition: transform .22s var(--ease), visibility 0s .22s; }
html.bd-lp-open .bd-lp { transform: none; visibility: visible; transition: transform .22s var(--ease); }
.bd-lp > .bd-head { flex: none; max-width: none; padding: 14px 16px 4px; }
.bd-lp > .bd-head h1 { margin: 6px 0 0; font-size: 17px; line-height: 1.3; letter-spacing: -.01em; }
.bd-lp > .bd-head .bd-sub { margin: 4px 0 0; font-size: 13px; }
.bd-lp-tabs { flex: none; padding: 8px 12px 10px; box-shadow: inset 0 -1px 0 var(--line-soft); }
.bd-lp-pane { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 10px 12px calc(16px + var(--tray-room, 0px)); }
.bd-lp-pane[hidden] { display: none; }
.bd-lp-pane .hint { margin: 12px 10px 0; font-size: 12px; line-height: 1.45; color: var(--fg-subtle); }
.bd-lp > .bd-head + .bd-lp-pane { margin-top: 10px; box-shadow: inset 0 1px 0 var(--line-soft); }
/* a design page's brief (TL;DR, the sections, status): the right panel's Brief tab */
.bd-sp-sec.bd-sp-brief { display: block; overflow: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 2px 16px calc(16px + var(--tray-room, 0px)); font-size: 14px; }
.bd-sp-brief :is(.bd-tldr, main) { width: auto; max-width: none; }
.bd-sp-brief .bd-tldr-card { margin-top: 2px; padding: 12px 14px; grid-template-columns: minmax(0, 1fr); }
.bd-sp-brief .bd-tldr-card .ico { display: none; }
.bd-sp-brief .bp-sec { padding-top: 18px; }
.bd-sp-brief .bp-sec + .bp-sec { margin-top: 18px; }
.bd-sp-brief .bp-sec > h2 { font-size: 16px; }
.bd-sp-brief .bd-meta { margin-top: 20px; }
html.bd-ann-m-point .bd-sp-brief *, html.bd-ann-m-point .bd-sp-brief { cursor: crosshair !important; }
html.bd-ann-m-select .bd-sp-brief *, html.bd-ann-m-select .bd-sp-brief { cursor: text !important; }
.bd-scr-l { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.bd-scr-l button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: none; text-align: left; font: inherit; font-size: 13.5px; color: var(--fg); cursor: pointer; }
.bd-scr-l button:hover { background: var(--hover); }
.bd-scr-l button[aria-current="true"] { background: var(--selected); box-shadow: inset 2px 0 0 var(--accent); }
.bd-scr-l .bd-ic { flex: none; width: 18px; height: 18px; color: var(--fg-subtle); }
.bd-scr-l .t { flex: 1; min-width: 0; display: grid; }
.bd-scr-l .t b { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.bd-scr-l .t span { font-size: 12px; color: var(--fg-subtle); }
.bd-scr-l .gone b { color: var(--risk-fg); text-decoration: line-through; }
.bd-scr-l .bd-chg-tag { height: 18px; padding: 0 6px; font-size: 10px; }
.bd-scr-l .rc { flex: none; font-size: 11.5px; color: var(--fg-subtle); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bd-scr-l .rc:empty { display: none; }
/* a revision's extra lines: the screens it changed (designs), the comments it resolves */
.bd-rv .rv-scr { margin: 6px 0 0; font-size: 12px; line-height: 1.45; color: var(--fg-muted); }
.bd-rv .rv-scr b { font-weight: 600; color: var(--fg); }
/* Present: one screen on a dark stage */
.bd-pres { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; background: oklch(14% 0.01 264); color: oklch(96% 0 0); }
.bd-pres .box { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; padding-top: 28px; }
.bd-pres .bar { display: flex; align-items: center; gap: 8px; margin: 12px 0 20px; padding: 6px 8px; border-radius: 14px; background: oklch(24% 0.01 264); }
.bd-pres .bar .bd-tbtn { color: oklch(88% 0 0); }
.bd-pres .bar .bd-tbtn:hover { color: #fff; background: oklch(32% 0.01 264); }
.bd-pres .cap { min-width: 220px; text-align: center; font-size: 13.5px; color: oklch(78% 0 0); }
.bd-pres .cap b { color: #fff; }
.bd-pres .bar .bd-tbtn:disabled { opacity: .4; cursor: default; }
/* the presented screen's labelled links; gesture links (nothing to tap) are buttons */
.bd-pres .hints { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 90vw; margin-top: 10px; }
.bd-pres .hints[hidden] { display: none; }
.bd-pres .hint { padding: 4px 10px; border: 0; border-radius: 999px; background: oklch(24% 0.01 264); color: oklch(90% 0 0); font: 500 12.5px/1.3 var(--sans); }
.bd-pres .hint .to { color: oklch(70% 0 0); }
.bd-pres button.hint { box-shadow: inset 0 0 0 1px oklch(42% 0.01 264); cursor: pointer; }
.bd-pres button.hint:hover { background: oklch(32% 0.01 264); }
html.bd-presenting :is(.bd-anntb, .bd-ann-layer, .bd-cmp) { display: none !important; }
.bd-psz { position: relative; flex: none; }
.bd-pdev { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
/* a deck: each slide as large as the window allows, its speaker notes under it (N shows or hides them) */
.bd-pres.slides .box { padding: 16px 16px 0; }
.bd-pres .notes { flex: none; box-sizing: border-box; width: min(960px, calc(100% - 32px)); max-height: 26vh; overflow: auto; margin-top: 12px; padding: 10px 16px; border-radius: 12px;
  background: oklch(21% 0.01 264); color: oklch(86% 0 0); font: 15px/1.5 var(--sans); }
.bd-pres .notes[hidden] { display: none; }
.bd-pres .notes > * { margin: 0; }
.bd-pres .notes > * + * { margin-top: .6em; }
.bd-pres .bar .bd-tbtn[aria-pressed="true"] { color: #fff; background: oklch(32% 0.01 264); }
.bd-pres .bar .bd-tbtn[hidden] { display: none; }
/* Export to… on the dark stage: a lit key, and its menu in the bar's dark */
.bd-pres .bar .bd-tbtn.bd-expb { color: #fff; background: oklch(33% 0.01 264); box-shadow: inset 0 0 0 1px oklch(44% 0.01 264); }
.bd-pres .bar .bd-tbtn.bd-expb:hover { color: #fff; background: oklch(38% 0.01 264); }
.bd-pres .bar .bd-tbtn.bd-expb[aria-expanded="true"] { background: oklch(20% 0.01 264); box-shadow: inset 0 0 0 1px oklch(44% 0.01 264); }
.bd-pres .bar .bd-tbtn.bd-expb:focus-visible { box-shadow: inset 0 0 0 1px oklch(44% 0.01 264), var(--focus-ring); }
.bd-pres .bar .bd-tbtn.bd-expb .cv { color: oklch(80% 0 0); }
.bd-pres .bd-expm { background: oklch(26% 0.01 264); color: oklch(96% 0 0); box-shadow: 0 0 0 1px oklch(38% 0.01 264), 0 14px 36px oklch(0% 0 0 / .55); }
.bd-pres .bd-expm button:is(:hover, :focus) { background: oklch(34% 0.01 264); }
.bd-pres .bd-expm button .bd-ic { color: oklch(82% 0 0); }
.bd-pres .bd-expm .t span { color: oklch(74% 0 0); }
/* a toast shows over Present, above its bar */
html.bd-presenting .bp-toast { z-index: 71; bottom: 84px; }
/* compare a screen across two revisions: side by side, or the shown one over the base (onion skin) */
.bd-cmpv { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; background: color-mix(in oklch, var(--canvas) 97%, transparent); }
.bd-cmpv .hd { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.bd-cmpv .hd > .bd-ic { width: 16px; height: 16px; color: var(--fg-subtle); }
.bd-cmpv .hd .r { font: 500 12px var(--mono); color: var(--fg-muted); }
.bd-cmpv .hd .sp { flex: 1; }
.bd-cmpv .hd input[hidden] { display: none; }
.bd-cmpv .bd-sg button .bd-ic { width: 14px; height: 14px; }
.bd-cmpv-b { flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; gap: 32px; padding: 20px; overflow: auto; }
.bd-cmpv-p { display: grid; justify-items: center; align-content: start; gap: 10px; }
.bd-cmpv-p .lb { font-size: 12.5px; color: var(--fg-muted); }
.bd-cmpv-p .lb b { font: 600 12.5px var(--mono); color: var(--fg); }
.bd-cmpv-p .msg { width: 280px; height: 200px; display: grid; place-items: center; padding: 16px; border: 1.5px dashed var(--line-strong); border-radius: 12px; text-align: center; font-size: 13px; color: var(--fg-subtle); }
.bd-cmpv[data-how="onion"] .bd-cmpv-b { display: grid; justify-content: center; }
.bd-cmpv[data-how="onion"] .bd-cmpv-p { grid-area: 1 / 1; justify-items: stretch; }
.bd-cmpv[data-how="onion"] .bd-cmpv-p > :not(.lb) { justify-self: center; }
.bd-cmpv[data-how="onion"] .bd-cmpv-p .lb { justify-self: start; }
.bd-cmpv[data-how="onion"] .bd-cmpv-p + .bd-cmpv-p .lb { justify-self: end; }
.bd-cmpv[data-how="onion"] .bd-cmpv-p + .bd-cmpv-p > :not(.lb) { opacity: var(--op, .5); }
/* the tray centres in the board, between the panels */
@media (min-width: 901px) { html.bd-lp-open :is(.bd-anntb, .bp-toast) { left: calc(var(--lp-w) + (100% - var(--lp-w)) / 2); } }
@media (min-width: 1101px) { html.bd-lp-open.bd-sp-open :is(.bd-anntb, .bp-toast) { left: calc(var(--lp-w) + (100% - var(--lp-w) - var(--sp-w)) / 2); } }
@media (max-width: 900px) { html.bd-lp-open .bd-boardblk { left: 0; } .bd-lp { width: min(var(--lp-w), 86vw); box-shadow: var(--shadow-3); } .bd-btb .th, .bd-btb .bd-sg { display: none; } }
/* the tray must fit the board: Accept recommended keeps its count, not its words */
:root[data-layout="board"] .bd-key.acc .t { display: none; }
/* a doc page's tray beside an open right panel (fitTray): keys keep their icon and count, not their words */
.bd-anntb.compact .bd-key :is(.t, .l) { display: none; }

/* ---------- a storelisting's platform pages (renderListing): the floating toolbar; the left panel's Text, Style,
   Colors and Checks; the device sections, each a card of its sets' shots at scale, in the full-bleed layer ---------- */
/* the toolbar: the board's (.bd-btb), one row, centred in the room the panels leave (fitLtb). Where its words don't
   fit, it sheds them a tier at a time (data-fit): 1 the view keys keep their icons, 2 Export to… its icon and the
   platforms their short names, 3 Jump to goes, 4 the drafts and Checks counts go (Comments and the Checks tab keep them) */
.bd-lst-btb { flex-wrap: nowrap; max-width: calc(100% - 24px); }
.bd-lst-btb > * { flex: none; white-space: nowrap; }
.bd-lst-btb .bd-sg button { display: inline-flex; align-items: center; gap: 5px; padding: 0 9px; font-weight: 600; white-space: nowrap; }
.bd-lst-btb .bd-sg button .bd-ic { width: 15px; height: 15px; }
.bd-lst-btb .bd-selw { margin: 0 2px; }
.bd-lst-btb .bd-selb .v { max-width: 150px; }
.bd-lst-btb .bd-exp { margin-left: 2px; }
.bd-lst-btb .bd-expb span { white-space: nowrap; }
.bd-lst-ckb { display: inline-flex; align-items: center; gap: 4px; color: var(--ok-fg, var(--fg-muted)); }
.bd-lst-ckb .bd-ic { width: 16px; height: 16px; }
.bd-lst-ckb .n { font-variant-numeric: tabular-nums; font-weight: 650; }
.bd-lst-ckb.err { color: var(--risk-fg); } .bd-lst-ckb.warn { color: var(--warn-fg); }
.bd-lst-btb [data-p] .ls { display: none; }
.bd-lst-btb:is([data-fit="1"], [data-fit="2"], [data-fit="3"], [data-fit="4"]) [data-view] { padding: 0 7px; }
.bd-lst-btb:is([data-fit="1"], [data-fit="2"], [data-fit="3"], [data-fit="4"]) [data-view] .w { display: none; }
.bd-lst-btb:is([data-fit="2"], [data-fit="3"], [data-fit="4"]) :is(.bd-expb > span, [data-p] .lf) { display: none; }
.bd-lst-btb:is([data-fit="2"], [data-fit="3"], [data-fit="4"]) [data-p] .ls { display: inline; }
.bd-lst-btb:is([data-fit="2"], [data-fit="3"], [data-fit="4"]) :is(.bd-sg button[data-p]) { padding: 0 7px; }
.bd-lst-btb:is([data-fit="2"], [data-fit="3"], [data-fit="4"]) .bd-selb .v { max-width: 96px; }
.bd-lst-btb:is([data-fit="3"], [data-fit="4"]) .bd-lst-jump, .bd-lst-btb[data-fit="4"] :is(.bd-dcount, .bd-lst-ckb) { display: none; }
/* a listing's Export to… menu: as wide as its longest description (ZIP (folders)'s) */
.bd-lstx .bd-expm { width: max-content; min-width: 260px; }
/* Export to…'s run on a listing (.bd-lstx, exportListing): the key turns into its progress, a spinner while the count
   is unknown, the format and files done of total, a × that cancels (so do a click on the key and Esc), a thin bar along
   its foot (role progressbar); then a tick and Exported, or an alert and Failed. Narrow (data-fit 2+): icon and bar */
.bd-lstx .xp, .bd-lstx .bd-xp-bar { display: none; }
.bd-lstx:is(.busy, .ok, .err) .bd-expb > :not(.xp) { display: none; }
.bd-lstx:is(.busy, .ok, .err) .bd-expb > .xp { display: inline-grid; place-items: center; }
.bd-lstx:is(.busy, .ok, .err) .bd-xp-bar { display: block; }
.bd-lstx .bd-expb .xp-l { min-width: 6.4em; font-weight: 600; font-variant-numeric: tabular-nums; text-align: left; place-items: center start; }
.bd-lstx .xp .bd-ic { width: 15px; height: 15px; }
.bd-lstx .xp-x { width: 18px; height: 18px; margin-left: 1px; border-radius: 5px; color: var(--fg-subtle); }
.bd-lstx.busy .bd-expb:hover .xp-x { color: var(--fg); background: var(--hover); }
.bd-lstx.busy .xp-lead { color: var(--accent-fg); }
