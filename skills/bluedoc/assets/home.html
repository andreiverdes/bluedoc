<style>
/* bluedoc home: HorizonUI components and tokens, plus this layout (bd-*). The blueprint palette stays navy in both themes. */
:root {
  --bp-navy-0: #04101f; --bp-navy-1: #071a33; --bp-navy-2: #0b2a4f; --bp-cyan: #5fd4ff; --bp-ice: #d6e9ff; --bp-dim: #6f93bd;
  --bp-amber: #ffc46b; --bp-green: #6fe3a1; --bp-red: #ff7a85; --bp-violet: #b9a2ff;
  --bd-folder: oklch(70% 0.14 248); --bd-folder-back: oklch(56% 0.16 252);
  --bd-t-docs: oklch(64% 0.16 252); --bd-t-review: oklch(68% 0.13 172); --bd-t-plan: oklch(68% 0.15 300); --bd-t-design: oklch(70% 0.15 20); --bd-t-other: oklch(66% 0.035 260);
  --bd-f-blocker: var(--color-hz-danger); --bd-f-major: var(--color-hz-warning); --bd-f-minor: var(--color-hz-info); --bd-f-nit: var(--color-hz-fg-subtle);
  --bd-top-h: 56px;
}
html, body { margin: 0; background: var(--color-hz-canvas); color: var(--color-hz-fg); }
/* no visible scrollbars anywhere on home: the page, the sidebar, the board and the widget strip still scroll (wheel, trackpad, keys) */
html, .bd-app * { scrollbar-width: none; }
html::-webkit-scrollbar, .bd-app ::-webkit-scrollbar { display: none; width: 0; height: 0; }
body { font-family: var(--font-hz-sans, Inter, system-ui, sans-serif); -webkit-font-smoothing: antialiased; }
.bd-app { min-height: 100vh; background: var(--color-hz-canvas); }
.bd-app a { color: inherit; }
.bd-shell { display: flex; min-height: 100vh; }
.bd-side { position: sticky; top: 0; height: 100vh; flex: none; z-index: 40; }
.bd-main { position: relative; flex: 1; min-width: 0; }
.bd-wrap { max-width: 1480px; margin: 0 auto; padding: 0 28px 96px; container: bd-wrap / inline-size; }
.bd-only-m { display: none !important; }
.bd-folder { flex: none; }
.bd-md code { font: 500 .9em var(--font-hz-mono); padding: 0 4px; border-radius: 4px; background: var(--color-hz-inset); }
.bd-app mark { background: color-mix(in oklch, var(--color-hz-warning) 34%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

/* sidebar slots */
.bd-brand { display: flex; align-items: center; gap: 9px; min-width: 0; padding-left: 6px; text-decoration: none; }
.bd-brand svg { flex: none; }
/* the wordmark: "bluedoc" in Lexend Bold (the logo's face, OFL-1.1), outlined to paths */
.bd-brand .wm { height: 14px; width: auto; }
.wm .b { fill: #0b2560; } .wm .d { fill: #0a6dff; }
[data-hz-theme="dark"] .wm .b { fill: #eaf4ff; } [data-hz-theme="dark"] .wm .d { fill: #4f9bff; }
.bd-rail .bd-brand { padding: 0; justify-content: center; }
.bd-side-foot { display: flex; align-items: center; gap: 8px; padding-left: 6px; font-size: 12.5px; color: var(--color-hz-fg-subtle); }
.bd-side-foot .sp { flex: 1; }
.bd-rail .bd-side-foot { padding: 0; justify-content: center; }
.bd-fl { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
.bd-fl > span { overflow: hidden; text-overflow: ellipsis; }

/* compact bar once the hero scrolls away */
.bd-top { position: sticky; top: 0; z-index: 30; height: var(--bd-top-h); margin-bottom: calc(-1 * var(--bd-top-h)); display: flex; align-items: center; gap: 12px; padding: 0 20px;
  background: color-mix(in oklch, var(--color-hz-canvas) 84%, transparent); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  box-shadow: 0 1px 0 var(--color-hz-line); transform: translateY(-100%); opacity: 0; pointer-events: none; transition: transform var(--hz-dur-3) var(--hz-ease-out), opacity var(--hz-dur-2); }
.bd-top.on { transform: none; opacity: 1; pointer-events: auto; }
.bd-top .bd-top-q { flex: 0 1 520px; margin: 0 auto; }
.bd-top .bd-top-n { font: 500 12px var(--font-hz-mono); color: var(--color-hz-fg-subtle); white-space: nowrap; }

.bd-hero-bar { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; align-items: center; gap: 8px; background: none !important; }
.bd-hero-bar .sp { flex: 1; }
.bd-hero-bar .wm .b { fill: #eaf4ff; } .bd-hero-bar .wm .d { fill: #5fa8ff; }
.bd-hero h1 { margin: 0; text-align: center; text-wrap: balance; color: var(--color-hz-fg); font: 620 clamp(28px, 3.3vw, 44px)/1.12 var(--font-hz-sans); letter-spacing: -.03em;
  text-shadow: 0 0 18px var(--color-hz-canvas), 0 0 4px var(--color-hz-canvas); }
.bd-hero .lede { margin: 10px 0 0; text-align: center; color: var(--color-hz-fg-muted); font-size: 14.5px; line-height: 1.5; }
.bd-hero .lede b { color: var(--color-hz-warning-fg, var(--color-hz-warning)); font-weight: 600; }
.bd-composer { width: min(740px, 100%); margin-top: 24px; padding: 8px; box-sizing: border-box; border-radius: 18px; background: var(--color-hz-surface);
  box-shadow: 0 0 0 1px var(--color-hz-line), 0 24px 60px -18px rgba(0, 8, 24, .65), var(--hz-shadow-3); }
.bd-composer .bd-q { height: 52px; border-radius: 12px; padding-inline: 14px; }
.bd-composer .bd-q input { font-size: 16.5px; }
.bd-composer .bd-q svg { width: 18px; height: 18px; }
.bd-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 9px 4px 2px; min-height: 28px; }
.bd-q-n { font: 500 12px var(--font-hz-mono); color: var(--color-hz-fg-subtle); white-space: nowrap; }
.bd-chips .lbl { font-size: 12px; color: var(--color-hz-fg-subtle); margin-right: 2px; }
.bd-sug { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--color-hz-inset); box-shadow: inset 0 0 0 1px var(--color-hz-line); color: var(--color-hz-fg-muted); font: 500 12.5px var(--font-hz-sans); }
.bd-sug:hover { color: var(--color-hz-fg); background: var(--color-hz-hover); }
.bd-sug:focus-visible { outline: none; box-shadow: var(--hz-shadow-focus); }
.bd-sug svg { width: 13px; height: 13px; }
.bd-sug .c { font: 500 11px var(--font-hz-mono); color: var(--color-hz-fg-subtle); }

/* sections */
.bd-sec-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 30px 0 14px; }
.bd-sec-head h2 { margin: 0; font: 620 18px/1.3 var(--font-hz-sans); letter-spacing: -.015em; }
.bd-sec-head .sub { font-size: 13px; color: var(--color-hz-fg-subtle); }
.bd-sec-head .sub .bd-fl { vertical-align: -3px; }
.bd-sec-head .sp { flex: 1; }

/* widgets */
.bd-widgets { display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
@container bd-wrap (max-width: 980px) { .bd-widgets { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container bd-wrap (max-width: 540px) {
  .bd-widgets { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 86%; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 10px; scroll-padding: 0 16px; }
  .bd-widgets > * { scroll-snap-align: start; }
}
.bd-w { min-width: 0; display: flex; flex-direction: column; }
.bd-w-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--color-hz-fg-muted); }
.bd-w-head svg { width: 15px; height: 15px; color: var(--color-hz-fg-subtle); }
.bd-w-head .r { margin-left: auto; font: 500 11.5px var(--font-hz-mono); color: var(--color-hz-fg-subtle); }
.bd-w-big { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; }
.bd-w-big b { font: 620 28px/1 var(--font-hz-sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.bd-w-big span { font-size: 12.5px; color: var(--color-hz-fg-subtle); }
.bd-w-big { flex-wrap: wrap; }
.bd-w-big .delta { flex-basis: 100%; margin-top: 2px; font: 500 11.5px var(--font-hz-mono); }
.bd-w-big .delta.up { color: var(--color-hz-success-fg); }
.bd-w-big .delta.down { color: var(--color-hz-fg-subtle); }
.bd-bars { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; align-items: end; height: 86px; margin-top: 14px; }
.bd-bars i { display: block; min-height: 3px; border-radius: 4px 4px 2px 2px; background: linear-gradient(180deg, var(--color-hz-accent), color-mix(in oklch, var(--color-hz-accent) 62%, transparent)); transform-origin: bottom; animation: bd-grow .6s var(--hz-ease-out) both; }
.bd-bars i.zero { background: var(--color-hz-line); }
.bd-bars i.today { background: linear-gradient(180deg, var(--bp-cyan), var(--color-hz-accent)); box-shadow: 0 0 14px -2px color-mix(in oklch, var(--bp-cyan) 70%, transparent); }
.bd-days { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; margin-top: 6px; text-align: center; font: 500 10px var(--font-hz-mono); color: var(--color-hz-fg-subtle); }
@keyframes bd-grow { from { transform: scaleY(0); } }
.bd-ring { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.bd-ring .tx b { display: block; font: 620 22px/1.1 var(--font-hz-sans); font-variant-numeric: tabular-nums; }
.bd-ring .tx span { font-size: 12.5px; color: var(--color-hz-fg-subtle); }
.bd-wl { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.bd-wl a, .bd-wl button { display: flex; align-items: center; gap: 9px; width: 100%; min-width: 0; padding: 6px 8px; margin: 0 -8px; border: 0; border-radius: 8px; background: none; text-align: left; text-decoration: none; color: var(--color-hz-fg); font: 13px var(--font-hz-sans); cursor: pointer; box-sizing: content-box; }
.bd-wl a:hover, .bd-wl button:hover { background: var(--color-hz-hover); }
.bd-wl a:focus-visible, .bd-wl button:focus-visible { outline: none; box-shadow: var(--hz-shadow-focus); }
.bd-wl .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-wl .m { flex: none; font: 500 11.5px var(--font-hz-mono); color: var(--color-hz-fg-subtle); }
.bd-wl .m.warn { color: var(--color-hz-warning-fg); }
.bd-wl .two { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.bd-wl .two .s { font-size: 11.5px; color: var(--color-hz-fg-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-w-empty { margin-top: 14px; font-size: 13px; line-height: 1.5; color: var(--color-hz-fg-subtle); }
.bd-stack { display: flex; height: 10px; gap: 3px; margin-top: 14px; border-radius: 6px; overflow: hidden; }
.bd-stack i { display: block; min-width: 4px; }
.bd-dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; }
.t-docs { --t: var(--bd-t-docs); } .t-review { --t: var(--bd-t-review); } .t-plan { --t: var(--bd-t-plan); } .t-design { --t: var(--bd-t-design); } .t-other { --t: var(--bd-t-other); }
.bd-dot.t-docs, .bd-dot.t-review, .bd-dot.t-plan, .bd-dot.t-design, .bd-dot.t-other, .bd-stack i { background: var(--t); }
.bd-finds { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--color-hz-line-soft); font-size: 12px; color: var(--color-hz-fg-muted); }
.bd-finds span { display: inline-flex; align-items: center; gap: 6px; }
.bd-finds b { font: 600 12px var(--font-hz-mono); color: var(--color-hz-fg); }

/* docs toolbar */
.bd-tools { position: relative; z-index: 2; }
