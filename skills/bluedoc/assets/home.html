.bd-card-f .bd-prog { margin-left: auto; }

/* the card hero: one navy frame for every type (status pill top-left, type pill top-right); each type draws its own
   element in it: review ±lines, plan step timeline, docs root drawing, design board outline, presentation slides, website pages, or an icon and one stat */
.bd-art { --pt: calc(12px + 22px + 4cqw); position: relative; flex: none; aspect-ratio: 16 / 10; overflow: hidden; container-type: inline-size; color: var(--bp-ice);
  background-color: #0b2648;
  background-image: linear-gradient(rgba(95, 212, 255, .12) 1px, transparent 1px), linear-gradient(90deg, rgba(95, 212, 255, .12) 1px, transparent 1px), linear-gradient(180deg, #0d2b52, #0a2140);
  background-size: 16px 16px, 16px 16px, auto; background-position: -1px -1px, -1px -1px, 0 0; }
.bd-art.err { background-color: #2a1220;
  background-image: linear-gradient(rgba(255, 138, 122, .12) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 138, 122, .12) 1px, transparent 1px), linear-gradient(180deg, #3a1624, #240d18); }
.bd-pill { position: absolute; top: 12px; z-index: 1; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 10px; border-radius: 999px; box-sizing: border-box;
  font: 600 11px/1 var(--font-hz-sans); white-space: nowrap; background: var(--pb); color: var(--pc); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pc) 20%, transparent); }
.bd-pill .lb { overflow: hidden; text-overflow: ellipsis; }
.bd-pill .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.bd-pill.st { left: 12px; max-width: calc(100% - 100px); }
.bd-pill.type { right: 12px; }
.bd-pill.t-review { --pb: #0b3a2a; --pc: #74e6ab; } .bd-pill.t-plan { --pb: #2d2350; --pc: #c3a6ff; }
.bd-pill.t-docs { --pb: #0b2f52; --pc: #5fd4ff; } .bd-pill.t-other { --pb: #2a2f38; --pc: #c9d2de; } .bd-pill.t-design { --pb: #4a1f2a; --pc: #ffa8b8; }
.bd-pill.t-presentation { --pb: #273d10; --pc: #bfe97a; } .bd-pill.t-website { --pb: #47290c; --pc: #ffbe85; } .bd-pill.t-storelisting { --pb: #0b3a44; --pc: #7fe3f0; }
.bd-pill.warn { --pb: #5b3b00; --pc: #ffc35a; } .bd-pill.info { --pb: #0b2f52; --pc: #5fd4ff; }
.bd-pill.risk { --pb: #4d1620; --pc: #ff8a7a; } .bd-pill.ok { --pb: #0b3a2a; --pc: #74e6ab; }
.bd-pill.arch { --pb: #2a2f38; --pc: #c9d2de; }
.bd-el { position: absolute; inset: var(--pt) 8% 8%; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.bd-el .cap, .bd-el-cap { font: 500 3.5cqw/1.3 var(--font-hz-mono); letter-spacing: .08em; text-transform: uppercase; color: #9fc6e8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* review: +N / −N, files and PRs, one dot per finding coloured by size */
.bd-rev .loc { display: flex; align-items: baseline; gap: 0 7cqw; font: 700 min(12.6cqw, calc(128cqw / var(--n))) / 1 var(--font-hz-mono); letter-spacing: -.02em; white-space: nowrap; }
.bd-rev .loc .a { color: #74e6ab; } .bd-rev .loc .d { color: #ff8a7a; }
.bd-rev .cap { margin-top: 3.4cqw; }
.bd-rev .fd { display: flex; flex-wrap: wrap; align-items: center; gap: 1.5cqw; margin-top: 4.4cqw; min-width: 0; }
.bd-rev .fd i { flex: none; width: 3.7cqw; height: 3.7cqw; border-radius: 50%; }
.bd-rev .fd .blocker { background: #ff8a7a; } .bd-rev .fd .major { background: #ffc35a; } .bd-rev .fd .minor { background: #5fd4ff; } .bd-rev .fd .nit { background: #8a94a3; }
.bd-rev .lg { margin-left: 1.5cqw; min-width: 0; font: 500 3.7cqw/1.2 var(--font-hz-sans); color: #9fc6e8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bd-rev .fd.wrap .lg { flex-basis: 100%; margin: .6cqw 0 0; }
/* plan: a dot per step (status) with a bar (effort), then A/M/D/R file counts */
.bd-pl { flex-direction: row; align-items: center; justify-content: space-between; gap: 6cqw; }
.bd-pl .tl { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5.2cqw; }
.bd-pl .tl::before { content: ''; position: absolute; left: 1.85cqw; top: 1.85cqw; bottom: 1.85cqw; width: 1px; transform: translateX(-.5px); background: rgba(95, 212, 255, .35); }
.bd-pl .ps { position: relative; display: flex; align-items: center; height: 3.7cqw; }
.bd-pl .pd { flex: none; box-sizing: border-box; width: 3.7cqw; height: 3.7cqw; border-radius: 50%; background: #0b2648; border: max(1px, .37cqw) solid #9fc6e8; }
.bd-pl .pb { flex: none; height: 2.2cqw; margin-left: 4.8cqw; border-radius: 1.1cqw; background: rgba(95, 212, 255, .3); }
.bd-pl .pe { margin-left: 2.2cqw; font: 500 3.3cqw/1 var(--font-hz-mono); color: #9fc6e8; }
.bd-pl .ps.done .pd { background: #74e6ab; border-color: #74e6ab; }
.bd-pl .ps.doing .pd { background: #5fd4ff; border-color: #5fd4ff; }
.bd-pl .ps.blocked .pd { background: #ff8a7a; border-color: #ff8a7a; }
.bd-pl .ps:is(.done, .doing) .pb { background: rgba(95, 212, 255, .5); }
.bd-pl .ps.blocked .pb { background: rgba(255, 138, 122, .5); }
.bd-pl .more { padding-left: 8.5cqw; font: 500 3.3cqw/1 var(--font-hz-mono); color: #9fc6e8; }
.bd-pl .fc { flex: none; display: flex; flex-direction: column; gap: 3.3cqw; font: 700 5.6cqw/1 var(--font-hz-mono); white-space: nowrap; }
.bd-pl .pn.add { color: #74e6ab; } .bd-pl .pn.edit { color: #5fd4ff; } .bd-pl .pn.delete { color: #ff8a7a; } .bd-pl .pn.rename { color: #ffc35a; }
.bd-pl .pn.zero { opacity: .4; }
/* docs: the root drawing, its first flow running on hover, kind · levels · flows under it */
.bd-drw { position: absolute; inset: var(--pt) 5% 7%; }
.bd-drw.capd { bottom: calc(8% + 6cqw); }
.bd-el-cap { position: absolute; left: 8%; right: 8%; bottom: 8%; }
.bd-art svg.cv { display: block; width: 100%; height: 100%; }
.bd-art .cv .n { fill: rgba(16, 52, 96, .78); stroke: var(--bp-ice); stroke-opacity: .8; stroke-width: 1.1px; }
.bd-art .cv .n.live { stroke: var(--bp-green); stroke-opacity: 1; }
.bd-art .cv .n.local { stroke: var(--bp-cyan); stroke-opacity: 1; }
.bd-art .cv .n.proposed, .bd-art .cv .n.unverified { stroke: var(--bp-amber); stroke-opacity: 1; stroke-dasharray: 5 3; }
.bd-art .cv .n.removed, .bd-art .cv .n.replaced { stroke: var(--bp-red); stroke-opacity: 1; stroke-dasharray: 5 3; }
.bd-art .cv .n.ext { stroke-dasharray: 5 3; }
.bd-art .cv .kid { fill: rgba(95, 212, 255, .10); stroke: var(--bp-cyan); stroke-opacity: .5; stroke-width: .8px; }
.bd-art .cv .e { fill: none; stroke-width: 1.2px; stroke: var(--bp-cyan); stroke-opacity: .7; stroke-dasharray: 3 3; }
.bd-art .cv .e.control { stroke: var(--bp-ice); stroke-opacity: .5; stroke-dasharray: 5 4; }
.bd-art .cv .e.async { stroke: var(--bp-violet); stroke-dasharray: 2 3; }
.bd-art .cv .e.power { stroke: var(--bp-amber); }
.bd-art .cv .e.dep { stroke: var(--bp-dim); stroke-opacity: .6; stroke-dasharray: 3 3; }
.bd-art .cv .e.replaced { stroke: var(--bp-red); stroke-dasharray: 5 3; }
.bd-art .cv .fl { fill: none; stroke: var(--bp-cyan); stroke-width: 3px; stroke-linecap: round; stroke-dasharray: 0 14; opacity: 0; }
.bd-card:is(:hover, :focus-visible) .bd-art .cv .fl { opacity: 1; animation: bd-flow-s 1s linear infinite; }
@keyframes bd-flow-s { to { stroke-dashoffset: -14; } }
.bd-art .cv text { font-family: var(--font-hz-mono); fill: var(--bp-ice); }
.bd-art .cv g.nodes { filter: drop-shadow(0 0 5px rgba(95, 212, 255, .28)); }
/* design: the board's outline, one shape per artboard (round watch, phone, window, 16:9 slide), dashed below hi-fi */
.bd-art .dsn .ab { fill: rgba(16, 52, 96, .78); stroke: var(--bp-ice); stroke-opacity: .85; stroke-width: 1.1px; }
.bd-art .dsn .ab.lo { stroke: var(--bp-amber); stroke-dasharray: 5 3; }
.bd-art .dsn .bar { stroke: var(--bp-ice); stroke-opacity: .45; stroke-width: 1px; }
.bd-art .dsn .ln { fill: rgba(95, 212, 255, .22); }
.bd-art .dsn .lk { fill: none; stroke: var(--bp-ice); stroke-opacity: .45; stroke-width: 1px; }
.bd-art .dsn g.abs { filter: drop-shadow(0 0 5px rgba(95, 212, 255, .28)); }
.bd-art .dsn .lv { fill: var(--bp-green); }
/* storelisting: a column per platform page (Google Play, App Store), a dot per section coloured by its worst check */
.bd-lsg { flex-direction: row; align-items: stretch; justify-content: center; gap: 6cqw; bottom: calc(8% + 6cqw); }
.bd-lsg .pc { display: flex; flex-direction: column; gap: 1.6cqw; min-width: 0; flex: 1 1 0; max-width: 38cqw; padding: 3cqw 3.4cqw; border-radius: 2.6cqw;
  background: rgba(16, 52, 96, .78); box-shadow: inset 0 0 0 1px rgba(214, 233, 255, .55), 0 0 10px rgba(95, 212, 255, .2); }
.bd-lsg .pc b { font: 600 4.2cqw/1.2 var(--font-hz-sans); color: var(--bp-ice); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bd-lsg .rw { display: flex; align-items: center; gap: 2cqw; font: 500 3.3cqw/1.2 var(--font-hz-mono); color: var(--bp-dim); white-space: nowrap; overflow: hidden; }
.bd-lsg .rw i { flex: none; width: 2.6cqw; height: 2.6cqw; border-radius: 50%; background: var(--bp-green); box-shadow: 0 0 6px var(--bp-green); }
.bd-lsg .rw.warn i { background: var(--bp-amber); box-shadow: 0 0 6px var(--bp-amber); }
.bd-lsg .rw.err i { background: var(--bp-red); box-shadow: 0 0 6px var(--bp-red); }
.bd-lsg .rw.err { color: var(--bp-red); }
/* docs with a hero, other docs, and every doc whose type has no data yet: an icon and one big stat */
.bd-stat { flex-direction: row; align-items: center; justify-content: flex-start; gap: 7cqw; left: 11%; }
.bd-stat .ic { flex: none; width: 19.5cqw; height: 19.5cqw; color: #5fd4ff; }
.bd-stat .ic svg { width: 100%; height: 100%; stroke-width: 2; filter: drop-shadow(0 0 8px rgba(95, 212, 255, .45)); }
.bd-stat .v { min-width: 0; }
.bd-stat b { display: block; font: 700 min(12.6cqw, calc(80cqw / var(--n))) / 1 var(--font-hz-mono); letter-spacing: -.02em; color: #d6e9ff; white-space: nowrap; }
.bd-stat .cap { margin-top: 2.6cqw; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.bd-stat.err .ic { color: #ff8a7a; }
.bd-stat.err .ic svg { filter: drop-shadow(0 0 8px rgba(255, 138, 122, .45)); }
.bd-stat .msg { font: 500 3.9cqw/1.35 var(--font-hz-mono); color: #ffc2c8; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

/* the docs table: a sticky column header and group headings (Today, This week, This month, Older), a row per doc;
   a row opens in place (.bd-rx). No project column once a project is picked */
.bd-tb { --cols: minmax(0, 1fr) 112px 176px 150px 88px 40px 80px; border-radius: var(--radius-hz-card); background: var(--color-hz-surface); box-shadow: var(--hz-shadow-1); }
.bd-tb.np { --cols: minmax(0, 1fr) 112px 150px 88px 40px 80px; }
.bd-r, .bd-hd { display: grid; grid-template-columns: var(--cols); gap: 16px; align-items: center; padding: 0 16px; }
.bd-r { cursor: pointer; }
.bd-hd { position: sticky; top: var(--bd-top-h); z-index: 3; height: 36px; border-radius: var(--radius-hz-card) var(--radius-hz-card) 0 0; background: var(--color-hz-panel); box-shadow: inset 0 -1px 0 var(--color-hz-line); }
.bd-hd > * { display: flex; align-items: center; gap: 4px; min-width: 0; padding: 0; border: 0; background: none; white-space: nowrap;
  font: 500 10.5px var(--font-hz-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--color-hz-fg-subtle); }
.bd-hd .so { display: flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font: inherit; letter-spacing: inherit; text-transform: inherit;
  color: var(--color-hz-accent-fg); cursor: pointer; }
.bd-hd .so svg { width: 12px; height: 12px; stroke-width: 2.2; }
.bd-hd .so:focus-visible { outline: none; border-radius: 4px; box-shadow: var(--hz-shadow-focus); }
.bd-gh { position: sticky; top: calc(var(--bd-top-h) + 36px); z-index: 2; display: flex; align-items: center; gap: 7px; width: 100%; height: 34px; padding: 0 16px 0 12px; box-sizing: border-box;
  border: 0; background: var(--color-hz-panel); box-shadow: inset 0 -1px 0 var(--color-hz-line-soft); color: var(--color-hz-fg); font: 600 13px var(--font-hz-sans); text-align: left; cursor: pointer; }
.bd-gh[aria-expanded="false"] { position: static; }
.bd-gh svg { width: 14px; height: 14px; color: var(--color-hz-fg-subtle); }
.bd-gh span { font: 500 12px var(--font-hz-mono); color: var(--color-hz-fg-subtle); }
.bd-gh:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--color-hz-accent); }
.bd-tb > :last-child { border-radius: 0 0 var(--radius-hz-card) var(--radius-hz-card); }
.bd-r { height: 40px; box-shadow: inset 0 -1px 0 var(--color-hz-line-soft); font-size: 13px; white-space: nowrap; color: var(--color-hz-fg); text-decoration: none; outline: none; }
.bd-r > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.bd-r:hover { background: var(--color-hz-hover); }
.bd-r:focus-visible { box-shadow: inset 0 0 0 2px var(--color-hz-accent); }
/* a row opens in place (the chevron turns); only its title opens the doc */
.bd-r.open, .bd-r.open:hover { background: var(--color-hz-hover); box-shadow: inset 2px 0 0 var(--color-hz-accent); }
.bd-ti > .cv { flex: none; width: 14px; height: 14px; margin-right: -3px; color: var(--color-hz-fg-subtle); transition: transform var(--hz-dur-2) var(--hz-ease-out); }
.bd-r:hover .bd-ti > .cv { color: var(--color-hz-fg-muted); }
.bd-r.open .bd-ti > .cv { transform: rotate(90deg); color: var(--color-hz-accent-fg); }
.bd-ti a.t { color: inherit; text-decoration: none; text-underline-offset: 3px; text-decoration-thickness: 1px; border-radius: 3px; outline: none; }
.bd-ti a.t:hover { color: var(--color-hz-accent-fg); text-decoration-line: underline; }
.bd-ti a.t:focus-visible { box-shadow: var(--hz-shadow-focus); }
.bd-ti { display: flex; align-items: center; gap: 9px; }
.bd-ti > b { flex: none; width: 20px; font-weight: 400; font-size: 15px; text-align: center; }
.bd-ti .t { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.bd-ti small { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: inherit; color: var(--color-hz-fg-subtle); }
.bd-m { font: 12px var(--font-hz-mono); color: var(--color-hz-fg-muted); }
.bd-m u { text-decoration: none; color: var(--color-hz-fg-subtle); }
.c-f > svg, .c-f > .bd-pe { display: inline-grid; margin-right: 6px; vertical-align: -2px; color: var(--color-hz-fg-subtle); }
.bd-no { color: var(--color-hz-fg-subtle); }
.bd-ty { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 22px; padding: 0 9px 0 8px; box-sizing: border-box; border-radius: 999px; overflow: hidden;
  font: 600 11.5px/1 var(--font-hz-sans); color: color-mix(in oklch, var(--t) 72%, var(--color-hz-fg)); background: color-mix(in oklch, var(--t) 15%, transparent); }
.bd-ty::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--t); }
.bd-sp { max-width: 100%; height: 22px; font-weight: 600; font-size: 11.5px; }
.bd-sp .dt { flex: none; width: 7px; height: 7px; margin-right: 2px; border-radius: 50%; background: currentColor; }
.bd-dc { display: flex; align-items: center; gap: 7px; font: 12px var(--font-hz-mono); color: var(--color-hz-fg-muted); }
.bd-rg { flex: none; width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(var(--color-hz-accent) calc(var(--p) * 1%), var(--color-hz-line-strong) 0);
  -webkit-mask: radial-gradient(circle, #0000 3.6px, #000 4.2px); mask: radial-gradient(circle, #0000 3.6px, #000 4.2px); }
.bd-rg.f { background: var(--color-hz-success); }
.bd-more { display: flex; align-items: center; width: 100%; height: 36px; padding: 0 16px 0 45px; box-sizing: border-box; border: 0; background: none; cursor: pointer; text-align: left;
  font: 500 12.5px var(--font-hz-sans); color: var(--color-hz-accent-fg); box-shadow: inset 0 -1px 0 var(--color-hz-line-soft); }
.bd-more:hover { text-decoration: underline; }
.bd-more:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--color-hz-accent); }

/* an open row, under it across the table: an inset card with the decided meter and the actions, the thumbnail beside
   the TL;DR and what is left, then the path, rev and last edit. One type scale: body 13.5/20 (TL;DR), list 13, mono 12,
   caps label 10.5; spacing on 4 and 8 */
.bd-rx { padding: 0 12px 12px; background: var(--color-hz-hover); box-shadow: inset 2px 0 0 var(--color-hz-accent), inset 0 -1px 0 var(--color-hz-line-soft);
  animation: bd-rx-in var(--hz-dur-2) var(--hz-ease-out); }
@keyframes bd-rx-in { from { opacity: 0; transform: translateY(-4px); } }
.bd-tl { margin: 0; max-width: 72ch; font-size: 13.5px; line-height: 20px; color: var(--color-hz-fg-muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.bd-cap2 { font: 500 10.5px/16px var(--font-hz-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--color-hz-fg-subtle); }
.bd-left { list-style: none; margin: 0; padding: 0; display: grid; }
.bd-left li { display: flex; align-items: center; gap: 8px; height: 24px; min-width: 0; font-size: 13px; color: var(--color-hz-fg); }
.bd-left li > svg { flex: none; width: 13px; height: 13px; color: var(--color-hz-fg-subtle); }
.bd-left li.dec > svg { color: var(--color-hz-warning-fg); }
.bd-left .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-left .z { flex: none; margin-left: auto; padding-left: 8px; font: 12px var(--font-hz-mono); color: var(--color-hz-fg-subtle); }
.bd-left .more { padding-left: 21px; font-size: 12px; color: var(--color-hz-fg-subtle); }
.bd-path { display: flex; align-items: center; gap: 4px; min-width: 0; font: 12px var(--font-hz-mono); color: var(--color-hz-fg-subtle); }
.bd-path > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-app .bd-path .bd-copy { flex: none; width: 24px; height: 24px; }
.bd-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bd-rx .x-card { gap: 16px; }
.bd-rx .x-hd { display: flex; align-items: center; gap: 16px; min-height: 32px; }
.bd-rx .x-meter { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 13px; color: var(--color-hz-fg-muted); }
.bd-rx .x-meter > div:first-child { flex: none; width: 160px; }
.bd-rx .x-meter b { color: var(--color-hz-fg); font-weight: 600; }
.bd-rx .x-open { font: 12px var(--font-hz-mono); color: var(--color-hz-warning-fg); }
.bd-rx .x-body { display: grid; grid-template-columns: 144px minmax(0, 1fr); gap: 16px; }
.bd-rx .x-thumb { align-self: start; width: 144px; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--color-hz-line); }
.bd-rx .x-thumb .bd-pill { display: none; }
.bd-rx .x-text { display: grid; gap: 8px; align-content: start; min-width: 0; }
.bd-rx .x-text .bd-cap2 { margin-top: 4px; }
.bd-rx .x-ft { display: flex; align-items: center; gap: 8px; min-width: 0; font: 12px var(--font-hz-mono); color: var(--color-hz-fg-subtle); white-space: nowrap; }
.bd-rx .x-ft .bd-path { flex: 0 1 auto; }
.bd-rx .x-dot { opacity: .6; }

/* the import page (/__bluedoc/import): the bar with the brand, one card in the middle */
.bd-imp-bar { display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 20px; box-shadow: 0 1px 0 var(--color-hz-line); background: var(--color-hz-surface); }
.bd-imp-t { font: 600 15px var(--font-hz-sans); color: var(--color-hz-fg); }
.bd-imp { box-sizing: border-box; width: min(640px, 100%); margin: 0 auto; padding: 40px 20px; }
.bd-imp-wait { color: var(--color-hz-fg-subtle); }
.bd-imp-card h1 { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font: 650 19px/1.3 var(--font-hz-sans); letter-spacing: -.01em; }
.bd-imp-sub { margin: 0 0 14px; font-size: 13.5px; color: var(--color-hz-fg-muted); }
.bd-imp-files { margin: 0 0 14px; padding: 4px 14px; list-style: none; border-radius: 10px; background: var(--color-hz-canvas); box-shadow: inset 0 0 0 1px var(--color-hz-line); }
.bd-imp-files li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font: 13px var(--font-hz-mono); border-top: 1px solid var(--color-hz-line); }
.bd-imp-files li:first-child { border-top: 0; }
.bd-imp-files li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.bd-imp-files .n { flex: none; color: var(--color-hz-fg-subtle); }
.bd-imp-files .same { color: var(--color-hz-fg-subtle); }
.bd-imp-fl { margin: 6px 0 8px; font: 600 13px var(--font-hz-sans); }
.bd-imp-row { display: flex; align-items: center; gap: 10px; }
.bd-imp-row > :not(code) { flex: none; }
.bd-imp-row button > span { display: inline-flex; align-items: center; gap: 6px; }
.bd-imp-row button svg { flex: none; width: 14px; height: 14px; }
.bd-imp-path { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 9px; font: 13px var(--font-hz-mono); overflow-wrap: anywhere; background: var(--color-hz-canvas); box-shadow: inset 0 0 0 1px var(--color-hz-line); }
.bd-imp-card .hz-banner, .bd-imp-card [role=alert] { margin-top: 12px; }
.bd-imp-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
.bd-imp-note { margin: 14px 0 0; font-size: 12px; color: var(--color-hz-fg-subtle); }
/* statistics (/stats): the header with Project and the range, the four widgets, then edits by project and the oldest open decisions */
.bd-stats-h { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 26px 0 18px; }
.bd-stats-h h1 { margin: 0; font: 620 22px/1.2 var(--font-hz-sans); letter-spacing: -.02em; }
.bd-stats-h .sub { font-size: 13px; color: var(--color-hz-fg-subtle); }
.bd-stats-h .sp { flex: 1; }
.bd-widgets.two { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; }
.bd-ebs { display: flex; flex-direction: column; margin-top: 12px; }
.bd-eb { display: grid; grid-template-columns: 118px 1fr; align-items: center; gap: 12px; height: 29px; font: 12.5px var(--font-hz-mono); color: var(--color-hz-fg-muted); text-decoration: none; border-radius: 6px; }
.bd-eb:hover { color: var(--color-hz-fg); }
.bd-eb:focus-visible { outline: none; box-shadow: var(--hz-shadow-focus); }
.bd-eb .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-eb i { display: flex; align-items: center; gap: 8px; font-style: normal; }
.bd-eb i::before { content: ""; flex: none; height: 12px; width: var(--w); border-radius: 3px; background: color-mix(in oklch, var(--color-hz-accent) 75%, transparent); }
.bd-ols { margin-top: 8px; }
.bd-ol { display: grid; grid-template-columns: minmax(0, 1fr) 120px 66px 40px; align-items: center; gap: 12px; height: 36px; font-size: 13px; box-shadow: inset 0 -1px 0 var(--color-hz-line-soft); }
.bd-ol:last-child { box-shadow: none; }
.bd-ol .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-ol .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--font-hz-mono); color: var(--color-hz-fg-subtle); }
.bd-ol .w { font: 500 12px var(--font-hz-mono); color: var(--color-hz-warning-fg); white-space: nowrap; }
.bd-ol .o { font-weight: 600; color: var(--color-hz-accent-fg); text-decoration: none; }
.bd-ol .o:hover { text-decoration: underline; }

.bd-empty { padding: 36px 0; border-radius: var(--radius-hz-card); background: var(--color-hz-surface); box-shadow: var(--hz-shadow-1); }
.bd-empty code { font: 500 12.5px var(--font-hz-mono); padding: 1px 5px; border-radius: 5px; background: var(--color-hz-inset); white-space: nowrap; }

/* archive: every card sits in a .bd-cw with its ⋯ menu (Archive / Unarchive) and, when the doc is all done, the
   "All done · Archive it?" line; an archived doc listed (the Archived status) is dimmed */
.bd-cw { position: relative; display: flex; flex-direction: column; min-width: 0; }
.bd-cw > .bd-card { flex: 1; }
.bd-cw.arch > .bd-card { opacity: .62; }
.bd-cw.arch:is(:hover, :focus-within) > .bd-card { opacity: .9; }
.bd-cm { position: absolute; z-index: 3; top: 9px; right: 9px; transition: transform var(--hz-dur-2) var(--hz-ease-out); }
.bd-cw:hover .bd-cm { transform: translateY(-3px); }
.bd-cm-b { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px; cursor: pointer; color: #dbe9ff;
  background: rgba(6, 22, 44, .78); box-shadow: inset 0 0 0 1px rgba(214, 233, 255, .16); opacity: 0; transition: opacity var(--hz-dur-2) var(--hz-ease-out); }
.bd-cm-b:hover { color: #fff; }
.bd-cm-b:focus-visible { outline: none; box-shadow: var(--hz-shadow-focus); }
.bd-cw:is(:hover, :focus-within) .bd-cm-b, .bd-cm.open .bd-cm-b { opacity: 1; }
.bd-cw .bd-pill.type { transition: right var(--hz-dur-2) var(--hz-ease-out); }
.bd-cw:is(:hover, :focus-within) .bd-pill.type { right: 46px; }
.bd-cw .bd-pill.st { max-width: calc(100% - 150px); }
@media (hover: none) {
  .bd-cm-b { opacity: 1; }
  .bd-cw .bd-pill.type { right: 46px; }
}
.bd-cm-m { position: absolute; top: calc(100% + 6px); right: 0; display: grid; min-width: 150px; padding: 5px; border-radius: 10px; background: var(--color-hz-surface); box-shadow: var(--hz-shadow-3); }
.bd-cm-m button { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border: 0; border-radius: 7px; background: none; color: var(--color-hz-fg); font: 500 13px var(--font-hz-sans); text-align: left; white-space: nowrap; cursor: pointer; }
.bd-cm-m button:is(:hover, :focus-visible) { outline: none; background: var(--color-hz-hover); }
.bd-cm-m svg { flex: none; color: var(--color-hz-fg-muted); }
.bd-sug { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 6px 8px 6px 14px; font-size: 12.5px; color: var(--color-hz-fg);
  background: color-mix(in srgb, var(--color-hz-success) 13%, var(--color-hz-surface)); border-radius: 0 0 var(--radius-hz-card) var(--radius-hz-card); box-shadow: var(--hz-shadow-1); }
.bd-sug > svg { flex: none; color: var(--color-hz-success); }
.bd-sug .t { flex: 1 0 auto; white-space: nowrap; }
.bd-sug .acts { display: flex; gap: 2px; margin-left: auto; }
.bd-cw.sug > .bd-card { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
/* the line under the results that says what archive hides; Show them turns on the Archived chip */
.bd-ahint { margin: 0; }
.bd-ahint:not(:empty) { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 8px; margin: 18px 0 0; font-size: 13px; color: var(--color-hz-fg-muted); }
.bd-ahint svg { flex: none; color: var(--color-hz-fg-subtle); }
.bd-ahint button, .bd-empty .bd-ahint-x button { padding: 0; border: 0; background: none; color: var(--color-hz-accent-fg); font: 600 13px var(--font-hz-sans); cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  text-decoration-color: color-mix(in oklch, currentColor 35%, transparent); }
.bd-ahint button:focus-visible, .bd-empty .bd-ahint-x button:focus-visible { outline: none; border-radius: 4px; box-shadow: var(--hz-shadow-focus); }
.bd-toast { position: fixed; z-index: 70; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; max-width: calc(100vw - 32px); padding: 10px 12px 10px 16px;
  border-radius: 12px; background: var(--color-hz-fg); color: var(--color-hz-canvas); box-shadow: var(--hz-shadow-3); font: 500 13.5px var(--font-hz-sans); }
.bd-toast button { padding: 4px 8px; border: 0; border-radius: 7px; background: none; color: inherit; font: 600 13.5px var(--font-hz-sans); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

/* settings (/settings): this computer's bluedoc settings in the main column, a section list beside the sections */
.bd-st-bar { display: none; }
.bd-st-bar .sp { flex: 1; }
.bd-st { max-width: 1040px; margin: 0 auto; padding: 36px 40px 64px; }
.bd-st code { font: 500 .92em var(--font-hz-mono); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; background: var(--color-hz-inset); color: var(--color-hz-fg-muted); }
.bd-st-top h1 { margin: 0; font: 650 28px/1.2 var(--font-hz-sans); letter-spacing: -.01em; }
.bd-st-top p { margin: 6px 0 0; font-size: 14px; color: var(--color-hz-fg-muted); }
.bd-st-body { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 36px; margin-top: 28px; }
.bd-st-nav { position: sticky; top: 24px; align-self: start; display: grid; gap: 2px; }
.bd-st-nav a { padding: 7px 10px; border-radius: 8px; font-size: 13.5px; color: var(--color-hz-fg-muted); text-decoration: none; }
.bd-st-nav a:hover { background: var(--color-hz-hover); color: var(--color-hz-fg); }
.bd-st-nav a:focus-visible { outline: none; box-shadow: var(--hz-shadow-focus); }
.bd-st-nav a[aria-current] { background: var(--color-hz-selected); color: var(--color-hz-fg); font-weight: 550; }
.bd-st-secs { display: grid; gap: 32px; min-width: 0; }
.bd-st-sec { scroll-margin-top: 24px; }
.bd-st-sec header { margin-bottom: 10px; }
.bd-st-sec h2 { margin: 0; font: 620 16px/1.3 var(--font-hz-sans); }
.bd-st-sec header p { margin: 4px 0 0; font-size: 13px; line-height: 1.45; color: var(--color-hz-fg-subtle); }
.bd-st-card { border-radius: 14px; background: var(--color-hz-surface); box-shadow: inset 0 0 0 1px var(--color-hz-line-soft), var(--hz-shadow-1); }
.bd-st-row { display: flex; align-items: center; gap: 18px; min-height: 58px; padding: 12px 16px; box-sizing: border-box; }
.bd-st-row + .bd-st-row { box-shadow: inset 0 1px 0 var(--color-hz-line-soft); }
.bd-st-l { flex: 1 1 0; min-width: 0; display: grid; gap: 3px; }
.bd-st-l b { font-size: 14px; font-weight: 560; overflow-wrap: anywhere; }
.bd-st-l span { font-size: 12.5px; line-height: 1.45; color: var(--color-hz-fg-subtle); overflow-wrap: anywhere; }
.bd-st-l b .bd-pnm span { font: inherit; color: inherit; }
.bd-st-c { flex: 0 1 auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
.bd-st-row.lk .bd-st-l b { color: var(--color-hz-fg-muted); }
.bd-st-row.note { justify-content: space-between; font-size: 13px; color: var(--color-hz-fg-muted); }
.bd-st-row.add { flex-wrap: wrap; gap: 10px; }
.bd-st-row.add .bd-st-in { flex: 1 1 260px; }
.bd-st-row.sub { min-height: 46px; padding-left: 32px; }
.bd-st-err, .bd-st-l .bd-st-err { flex-basis: 100%; margin: 0; font-size: 12.5px; color: var(--color-hz-danger-fg); }
.bd-st-env { min-width: 0; padding: 3px 8px; border-radius: 7px; font: 500 11.5px var(--font-hz-mono); overflow-wrap: anywhere; color: var(--color-hz-info-fg); background: var(--color-hz-info-tint); }
.bd-st-path { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bd-st-path .bd-st-in { width: 280px; }
.bd-st-in input { font-size: 13px; }
.bd-st-ok { font-size: 12px; white-space: nowrap; color: var(--color-hz-success-fg); }
.bd-st-ok.no { color: var(--color-hz-fg-subtle); }
.bd-st-v { min-width: 0; font: 500 13px var(--font-hz-mono); color: var(--color-hz-fg-muted); overflow-wrap: anywhere; }
.bd-st-l .bd-st-wait { color: var(--color-hz-info-fg); }
.bd-st-none { font-size: 13px; color: var(--color-hz-fg-subtle); }
/* Sharing: two cards, each with a head row; a project's account a key with its avatar and login (the menu: HorizonUI's
   DropdownMenu), gh's accounts with their scope */
.bd-sh-card + .bd-sh-card { margin-top: 16px; }
.bd-sh-ch { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; font-weight: 600; font-size: 14px; }
.bd-sh-ch svg { width: 16px; height: 16px; color: var(--color-hz-fg-muted); }
.bd-sh-ch + .bd-st-row { box-shadow: inset 0 1px 0 var(--color-hz-line-soft); }
.bd-sh-fi { width: 16px; height: 16px; flex: none; color: var(--color-hz-fg-muted); }
.bd-st-l .bd-sh-path { font: 11.5px var(--font-hz-mono); }
.bd-sh-lg, .bd-sh-acct b, .bd-sh-opt b { font: 600 13px var(--font-hz-mono) !important; }
.bd-sh-st { font-size: 12px; color: var(--color-hz-fg-muted); text-align: right; overflow-wrap: anywhere; }
.bd-sh-acct { display: inline-flex; align-items: center; gap: 9px; width: 250px; height: 36px; padding: 0 10px 0 8px; border: 0; border-radius: 9px; font: inherit; text-align: left; cursor: pointer;
  color: var(--color-hz-fg); background: var(--color-hz-canvas); box-shadow: inset 0 0 0 1px var(--color-hz-line); }
.bd-sh-acct:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--color-hz-line-strong); }
.bd-sh-acct:focus-visible { outline: none; box-shadow: var(--hz-shadow-focus); }
.bd-sh-acct:disabled { opacity: .55; cursor: default; }
.bd-sh-acct b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-sh-acct .ask { color: var(--color-hz-fg-subtle); font-size: 13.5px; }
.bd-sh-acct .cv { width: 14px; height: 14px; margin-left: auto; flex: none; color: var(--color-hz-fg-subtle); }
.bd-sh-opt { display: inline-flex; align-items: center; gap: 8px; }
.bd-sh-opt small { font-size: 12px; color: var(--color-hz-fg-subtle); }
@media (max-width: 760px) { .bd-sh-acct { width: 100%; } .bd-sh-st { text-align: left; } }

/* mobile drawer */
.bd-drawer { position: fixed; inset: 0; z-index: 45; }   /* under HorizonUI's menus and dialogs (z 50) */
.bd-drawer .scrim { position: absolute; inset: 0; background: var(--color-hz-scrim, rgba(0, 0, 0, .4)); animation: bd-fade var(--hz-dur-2) both; }
.bd-drawer .panel { position: absolute; top: 0; bottom: 0; left: 0; box-shadow: var(--hz-shadow-4); animation: bd-slide var(--hz-dur-3) var(--hz-ease-out) both; }
@keyframes bd-fade { from { opacity: 0; } }
@keyframes bd-slide { from { transform: translateX(-100%); } }

@media (max-width: 1100px) {
  .bd-tb, .bd-tb.np { --cols: minmax(0, 1fr) 104px 150px 88px 76px; }
  .bd-tb :is(.c-f, .c-rv) { display: none; }
}
@media (max-width: 899px) {
  .bd-side { display: none; }
  .bd-only-m { display: inline-flex !important; }
  .bd-wrap { padding: 0 16px 80px; }
  .bd-top { padding: 0 12px; gap: 8px; }
  .bd-top :is(.bd-top-n, .bd-tbar) { display: none; }
  .bd-top .bd-top-q { flex: 1 1 auto; }
  /* settings: no sidebar, so the bar keeps the drawer's key and the theme key, over the page */
  .bd-st-bar { display: flex; }
  .bd-st-bar + :is(.bd-st, .bd-wrap) { padding-top: calc(var(--bd-top-h) + 20px); }
  .bd-widgets.two { grid-template-columns: minmax(0, 1fr); }
}
/* settings on a phone: one column, no section list (the page scrolls) */
@media (max-width: 760px) {
  .bd-st { padding: 20px 14px 48px; }
  .bd-st-top h1 { font-size: 22px; }
  .bd-st-body { grid-template-columns: minmax(0, 1fr); margin-top: 18px; }
  .bd-st-nav { display: none; }
  .bd-st-row { flex-wrap: wrap; gap: 10px; }
  .bd-st-c { flex: 1 1 100%; flex-wrap: wrap; }
  .bd-st-path, .bd-st-path .bd-st-in { flex: 1 1 100%; width: 100%; }
}
@media (max-width: 700px) {
  .bd-tb, .bd-tb.np { --cols: minmax(0, 1fr) auto 64px; }
  .bd-tb :is(.c-ty, .c-dc) { display: none; }
  .bd-tbar { flex-wrap: wrap; }
  /* the open row's head and foot wrap once the table is down to three columns */
  .bd-rx .x-hd { flex-wrap: wrap; }
  .bd-rx .x-meter { flex: 1 0 100%; }
  .bd-rx .x-ft { flex-wrap: wrap; white-space: normal; }
}
/* phones: the drawer for the sidebar, a shorter hero with the whole picture, the toolbar on one row that scrolls
   sideways, the table as a list (title, then type · status · decisions · age; project and rev in the open row), the
   statistics one widget a row; touch targets 40 px */
.bd-only-p { display: none !important; }
@media (max-width: 600px) {
  .bd-only-p { display: inline-flex !important; }
  .bd-grid { grid-template-columns: minmax(0, 1fr); }
  .bd-wrap { padding: 0 12px 72px; }
  .bd-hero-bar { top: 6px; left: 6px; right: 6px; gap: 2px; }
  .bd-app :is(.bd-hero-bar, .bd-top, .bd-sb-foot, .bd-sb-top, .bd-st-bar) button[aria-label] { width: 40px; height: 40px; }
  .bd-hero-pix { min-height: 0; }
  .bd-hero-in { padding: calc(100vw * 523 / 1672 - 6px) 12px 22px; }
  .bd-hero h1 { font-size: 25px; }
  .bd-hero .lede { margin-top: 6px; font-size: 13px; }
  .bd-composer { margin-top: 16px; padding: 6px; border-radius: 16px; }
  .bd-composer .bd-q { height: 46px; }
  .bd-composer .bd-q input { font-size: 16px; }
  .bd-stat-l { gap: 2px 8px; margin-top: 14px; font-size: 13px; line-height: 1.6; }
  .bd-top { gap: 6px; padding: 0 6px 0 4px; }
  /* Docs, its count, then the toolbar on its own row, scrolling sideways out to the screen's edges */
  .bd-sec-head { margin: 10px 0 10px; }
  .bd-sec-head .sp { display: none; }
  .bd-sec-head .bd-tbar { flex: 1 0 100%; flex-wrap: nowrap; overflow-x: auto; margin: 0 -12px; padding: 3px 12px; }
  .bd-tbar > * { flex: none; }
  .bd-fc { height: 40px; padding: 0 12px 0 14px; font-size: 13px; }
  .bd-fc.on { padding-right: 4px; }
  .bd-fc .x { width: 32px; height: 32px; }
  .bd-tbar [role=radiogroup] { height: 40px; }
  .bd-tbar [role=radiogroup] button { height: 34px; }
  /* the list */
  .bd-hd { display: flex; justify-content: space-between; height: 34px; padding: 0 14px; }
  .bd-hd > :not(:first-child):not(:last-child) { display: none; }
  .bd-gh { top: calc(var(--bd-top-h) + 34px); height: 40px; }
  .bd-tb .bd-r { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 6px; height: auto; min-height: 56px; padding: 9px 12px 10px; white-space: normal; }
  .bd-tb .bd-r > * { overflow: visible; }
  .bd-tb .bd-r > .bd-ti { flex: 1 0 100%; align-items: flex-start; }
  .bd-ti > .cv, .bd-ti > b { margin-top: 1px; }
  .bd-ti .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; line-height: 1.35; font-size: 14px; }
  .bd-ti small { display: none; }
  .bd-tb .bd-r > .c-ty { margin-left: 20px; }
  .bd-tb .bd-r > :is(.c-f, .c-rv) { display: none; }
  .bd-tb .bd-r > .c-st:has(.bd-no), .bd-tb .bd-r > .c-dc:has(.bd-no) { display: none; }
  .bd-tb .bd-r > :is(.c-ty, .c-st, .c-dc, .c-up) { display: inline-flex; }
  .bd-tb .bd-r > :is(.c-dc, .c-up)::before { content: "·"; margin-right: 6px; color: var(--color-hz-fg-subtle); font-family: var(--font-hz-sans); }
  .bd-tb .bd-r :is(.bd-ty, .bd-sp) { height: 22px; padding: 0 7px 0 6px; font-size: 11px; gap: 5px; }
  .bd-tb .bd-r .bd-dc { gap: 5px; }
  .bd-rx { padding: 0 8px 8px; }
  .bd-rx .x-body { grid-template-columns: minmax(0, 1fr); }
  .bd-rx .x-thumb { width: 100%; }
  .bd-rx .x-meter > div:first-child { width: 120px; }
  .bd-acts > button { height: 40px; }
  .bd-app .bd-acts > button[aria-label] { width: 40px; }
  .bd-more { height: 44px; padding-left: 14px; }
  .bd-nb { flex-wrap: wrap; padding: 8px 8px 8px 12px; row-gap: 4px; }
  .bd-nb .sp { display: none; }
  .bd-nb > button { margin-left: auto; height: 36px; }
  /* statistics: one widget a row, the range across the page */
  .bd-stats-h { gap: 10px; margin: 14px 0 14px; }
  .bd-stats-h .sp { display: none; }
  .bd-stats-h > [role=radiogroup] { flex: 1 0 100%; height: 40px; }
  .bd-stats-h > [role=radiogroup] > button { flex: 1; height: 34px; }
  .bd-widgets, .bd-widgets.two { grid-template-columns: minmax(0, 1fr); grid-auto-flow: row; overflow: visible; margin: 0; padding: 0; }

function folderDirs(docs) {
  const counts = new Map();

    const kids = [...counts.keys()].filter(k => k.split('/').length === depth && (depth === 1 || k.startsWith(parent + '/')));
    kids.sort((a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b));

  };
